title = "A shared runner: one queue, one job at a time, with warm neuroNCAP renderers and a persistent CARLA"
short = "Shared gate runner"
track = "enabler"
owner = "Naren"
benchmarks = ["navsim", "kitscenes", "nuscenes", "neuroncap", "bench2drive", "alpasim"]
started = 2026-10-21
status = "running"
verdict = "none"
priority = 9
question = """Can runs from all three of us share the GPU and simulators safely? Nothing coordinated \
between users: GPU waits reserved nothing until #100's GPU lock (merged 22 Oct), a crashing CARLA killed \
its user's other CARLAs, AlpaSim used fixed ports, and Navvrat was not in the docker group. The plan: one \
queue that runs one job at a time, each job naming a checkpoint in a shared store, with warm neuroNCAP \
renderers and a persistent CARLA owned by the queue. It waited on the machine admin for a paddock service \
account and a group for the three of us."""
learned = """So far: the queue landed (paddock #109, 26 Oct) and runs as the paddock account, one job at a \
time, with each submitted checkpoint copied into a shared store by its sha256 and the code pinned to a \
pushed commit; by 27 Oct it had made Drive-JEPA's quick- and closed-tier baselines and gated a \
teammate's candidate. Not built: warm simulators. Every benchmark run still starts its simulator cold."""
narrative = "experiments/H09_shared_runner/README.md"
external = [
  "Queue jobs: job.json and result.json under the queue root's jobs/ ([queue] root in the site paddock.toml), on shakaal.",
]

