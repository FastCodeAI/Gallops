# H19 -- carrying the planner's own per-path outputs across moments makes the picker steadier and earlier.
# Owner Naren.
# Sources: Naren's plan of 5 Nov 2026 (paddock checkout, memory-layer-plan.md, "Rewritten 5 Nov 2026",
# appendix :143-280), Siddesh's review MEMORY_PLAN_V2_REVIEW.md (paddock-sid/memory) and Siddesh's choices
# of 5 Nov, which are pinned below. Numbers about the saved data are from H05.r1's cache. Those choices were
# numbered in his working notes; the numbers are written "choice 10" here, because D10, D11, ... name other
# decisions in experiments/decisions.toml. PREDICTIONS.md and GATE_EXPECTATIONS.md (added in #31) were committed before the
# runs and keep the old labels ("Sid D23", "Sid D29", "Sid D30"): they mean these choices, not the decision log.
# The rules for every field are in docs/experiments.md; src/gallops/experiments.py validates them.

schema = 1
id = "H19"
title = "Carrying the planner's output embeddings across moments makes the picker steadier and earlier"
short = "Prediction memory"
track = "hypothesis"
owner = "Naren"
contributors = ["Siddesh"]
benchmarks = ["navsim", "neuroncap", "bench2drive", "alpasim", "kitscenes", "nuscenes"]
started = 2026-11-05
status = "running"
verdict = "none"
question = """Released Drive-JEPA decides every moment from scratch: its 32 proposals and their scores \
are recomputed from one moment (now and 0.5 s ago) with nothing kept. On saved data (40 val logs, \
released model, momentum off, predicted scores rather than true grades) back-to-back picks are more \
than 1 m apart on 45% of moments while a path 0.34 m from the old pick is still on the menu, and the \
top two predicted scores differ by 0.003. Does a small memory of what the planner and picker concluded \
at earlier moments settle those near-ties the right way, and brake no later on the side crashes?"""
hypothesis = """A selective state-space memory per path, fed that path's planner output embedding \
(the scorer input, 256 numbers), its six released score logits and the ego status, and carried to the \
closest proposal of the next moment (ego-motion aligned; no match beyond 2 m starts empty), nudges the \
released final score; the camera never reaches it and everything released stays frozen, so the 32 \
proposals are the released ones and a zero nudge reproduces released picks. Arms, same size, data order \
and training (3 seeds each): (a) memory carried, length 1, 2 or 4 moments chosen on the selection set, \
warm-up 1-16; (b) the same layer wiped every moment; (c) released. Momentum is off for all three arms \
offline and on for all three in the gate. Expected: (a) picks better-graded paths than (b) on the 214 \
val logs, with fewer flips and better two-frame comfort, nothing regresses against released on the \
gate, and on neuroNCAP's side pairs (a) scores above (b) and brakes no later. Refuted at the go/no-go \
unless the 3-seed mean of (a) - (b) in true PDM grade of the pick is above 0 with a CI excluding 0 \
(flips and comfort are secondary, reported with CIs); after the gate unless (a) beats (b), nothing \
regresses against released and braking starts no later. The effect size is stated in PREDICTIONS.md \
once the val logs are graded, before training."""
predictions = "experiments/H19_prediction_memory/PREDICTIONS.md"
narrative = "experiments/H19_prediction_memory/README.md"
parents = ["H05"]  # the cache H05.r1 built is this experiment's input data

# Pinned before anything runs (Siddesh, 5 Nov; Naren's agreement assumed on choices 10-12):
#   choice 10: momentum OFF for arms a, b, c offline; ON for every arm in the gate.
#   choice 11: the motivation numbers (0.003 gap, 45 % flips) are predicted scores with momentum off; they are
#       re-measured after grading with true grades and momentum-on states.
#   choice 12: navtest re-grade check: grade without the anchors load; compare shared sub-scores with run
#       navsim/drivejepa/20261023T202240-de2f00 within a tolerance set from the 200-token timing run.
#   choice 15: go/no-go: P1 (mean true grade of the pick, (a) vs (b)) is primary and must have a CI excluding 0;
#       flips and comfort are secondary, reported with CIs, each with its own n; 3 seeds, the bootstrap
#       is of the seed mean, and each seed is shown.
#   choice 16: memory lengths 1, 2, 4 ("no limit" dropped); warm-up 1-16.
#   choice 17: grading on 4 cores (taskset -c 0-3, 4 workers); training stays on 2 cores.
#
# Code: gallops.memory.grade (H19.r1), .align (H19.r2), .model, .train, .evaluate (H19.r3). The gate
# runs (a) and (b) seed 0 by hand from a throwaway paddock checkout (Siddesh's choices 28-30, 5 Nov); paddock gets
# no PR (paddock rule of 4 Nov: released checkpoints only).

[[runs]]
id = "H19.r1"
label = "true grades of the 32 released proposals at every graded navtrain moment"
started = 2026-11-05
start_from = "H05.r1"
frozen = ["all of Drive-JEPA: encoder, generator and scorer"]
notes = """The vendor's training-time grader (compute_navsim_score: simulate, score_proposals, \
after_score_proposals) on H05.r1's cached proposals with the train metric cache, without the anchors \
load: the strict grade H19 trains on (Siddesh's choice 22). Also stored per path: lane keeping and traffic light \
the benchmark's way (lane keeping checked every 0.1 s, not 0.5 s; either set to 1 where the human \
driver's own path fails it), and the human path's own scores. States keep x, y relative to a float64 \
origin. Navtest check (200 picks of navsim/drivejepa/20261023T202240-de2f00 against its CSV): the \
five gates-and-comfort sub-scores and the forgiving lane keeping and traffic light agree exactly on \
200/200, progress within 1e-4 on 199; strict lane keeping (33) and traffic light (3) differ only \
ours 0 against the CSV's 1, all explained: 30 by the human filter, 6 by the coarse 0.5 s lane check, \
and the progress case by the human filter (the human fails driving direction). Tolerance (Siddesh's choice 23) \
set on those same 200 tokens. Batches: val (214 logs), selection (100), rest (878)."""

  [runs.code]
  modules = ["gallops.memory.grade"]
  as_run = ["experiments/H19_prediction_memory/scripts/"]

[[runs]]
id = "H19.r2"
label = "matching each path to the previous moment's closest path (built; statistics on the val logs)"
started = 2026-11-05
start_from = "H05.r1"
frozen = ["all of Drive-JEPA: encoder, generator and scorer"]
notes = """The previous moment's waypoints 2-8 moved into the current ego frame (logged poses), \
compared with the current waypoints 1-7 by mean distance; each new path takes its closest old path, \
or none beyond 2 m. Reproduces Naren's slot-stability numbers on the same 40 val logs exactly (3,927 \
pairs; closest 0.397 m, same slot 38.47%, pick unchanged 46.88%). On all 214 val logs (18,798 pairs), \
from the new path's side: closest 0.344 m median, same slot 29.1%, no old path within 2 m for 0.60% of \
paths, the pick 0.18%; not concentrated in turns. Chain starts are 11.2% of val moments but 6 of the \
15,320 graded ones. The table on the store was built from an uncommitted tree: its manifest says \
97c518a...-dirty, 36 seconds before cdacc38. align.py did not change between the two, and 400 random rows \
rebuilt with align.py at cdacc38 are identical (reported by the review of #31, not re-run here)."""

  [runs.code]
  modules = ["gallops.memory.align"]
  as_run = ["experiments/H19_prediction_memory/scripts/"]

[[runs]]
id = "H19.r3"
label = "the memory picker: selection of length and epochs, then (a) carried and (b) wiped, 3 seeds, evaluated with (c) released on the val logs"
started = 2026-11-05
start_from = "released"
trained = ["memory picker (new: per-path input MLP, keep gate, nudge MLP with a zero-started last layer)"]
frozen = ["all of Drive-JEPA: encoder, generator and scorer"]
notes = """Strict final grade as the BCE target (Siddesh's choice 22), graded moments of the 878 train logs that are \
not selection logs; windows along chains, warm-up 1-16; 8 epochs; length and epoch count chosen on the \
100 selection logs by the rule in PREDICTIONS.md; momentum off for every arm offline (Siddesh's choice 10). \
Selection (seed 0): L = 4 and 6 epochs by the rule; the three lengths' best selection losses differ by \
5e-6 (0.288801 / 0.288804 / 0.288806), so the length is a coin toss; released 0.30156. Preflight passed \
(untrained = released on 200/200 val moments, carry = reset on 256 chain starts). Trained on GPU with \
cores 0-1 (Siddesh's choice 27), 2.7 min for the six final runs. Checkpoints are runs H19.r3-a-s0 ... H19.r3-b-s2. \
Evaluated on the 214 val logs (15,320 graded moments in 179 of them), momentum off, 3-seed mean, \
log-clustered paired bootstrap, 2,000 draws. Verdict: P1 supported but not useful; (a) level with \
released on grade, -3.0 pts on two-frame comfort; matching rule: go to gate."""
train_git_sha = "cdacc3871df01d87547cb707391c4b62b05c3e57"

  [runs.code]
  modules = ["gallops.memory.model", "gallops.memory.train", "gallops.memory.evaluate"]

  [[runs.data]]
  dataset = "navsim"
  split = "navtrain: the 878 train logs that are not H19 selection logs; 763 of them have a graded moment and gave the weights a target"
  role = "train"
  n = 69650
  unit = "samples"
  note = "graded moments; windows reach back along chains into ungraded moments"

  [[runs.data]]
  dataset = "navsim"
  split = "navtrain: the 100 H19 selection logs"
  role = "selection"
  n = 7007
  unit = "samples"
  scene_list = "experiments/H19_prediction_memory/selection_logs.txt"
  note = "chose the memory length and the epoch count"

  [[runs.data]]
  dataset = "navsim"
  split = "navtrain: the 214 vendor val logs"
  role = "eval"
  n = 15320
  unit = "samples"
  note = "reported on; graded moments in 179 of the 214 logs; the bootstrap resamples all 214"

  [[runs.results]]
  headline = true
  bench = "offline"
  metric = "P1: mean strict PDM grade of the pick, (a) carried L=4"
  n = 15320
  unit = "sample"
  baseline = "(b) wiped, same layer"
  baseline_value = "0.86715"
  value = "0.86827"
  better = "higher"
  strength = "moderate"
  flags = ["open-loop"]
  note = "(a) - (b) +0.00112, 95% CI [+0.00020, +0.00212], excludes 0 but below the +0.005 usefulness bar: supported but not useful (predicted +0.01). Per seed +0.00078 / +0.00020 / +0.00237. The interval resamples logs, not training seeds: the sign held in 3 of 3 seeds, but the per-seed differences give t = 1.72 on 2 degrees of freedom, and seeds of one arm differ by up to 0.0045, four times the effect (strength moderate, not strong). Released (c) 0.86880: (a) - (c) -0.00052 [-0.00298, +0.00206]"
  source = "{data}/memory_cache/h15/evaluate.json (navtrain cache); write-up MEMORY_H15_STEP3.md (Siddesh, 5 Nov)"

