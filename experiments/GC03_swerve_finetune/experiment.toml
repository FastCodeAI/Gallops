# GC03 -- the swerve finetune: eleven runs teaching released Drive-JEPA to evade on reconstructed scenes
# with inserted hazards (Naren). Every number is copied, never re-derived, from experiments/GC03_swerve_finetune/README.md,
# except: weights hashes, steps, commits, label sets and tick counts, read from each checkpoint's sidecar
# (`gallops experiments checkpoint`); and the pairing of each 0103 smoke with the step it drove, read from the
# path digest in the paddock run.json (paddock branch record/drivejepa-camera-blind) and matched here to the
# step's exported agent.ckpt. Run dates are the day each checkpoint was written, IST, as the doc dates v4.
# Every result is camera-blind (`blind`): no image reached the model (the doc's 2026-10-12 correction).

schema = 1
id = "GC03"
title = "The swerve finetune: teaching Drive-JEPA to evade on reconstructed scenes with inserted hazards"
short = "Swerve finetune, 11 runs"
track = "gap-closing"
owner = "Naren"
benchmarks = ["neuroncap", "offline"]
started = 2026-09-26
ended = 2026-10-12
status = "parked"
verdict = "inconclusive"
question = """Paddock's neuroNCAP sweep put Drive-JEPA's frontal split at 2.42 against 4.23 on stationary: it \
drives into oncoming traffic. Across all 32 proposals the widest reaches 0.70 m sideways on a frontal tick, and \
navtrain's 20 hours hold 1.5 s of emergency braking and no evasions. Can expert-labelled episodes on \
reconstructed nuScenes train scenes, with hazards inserted on collision courses, teach it to evade?"""
learned = """Eleven camera-blind finetunes taught no evasion. The one run taken to the full neuroNCAP set, s1 \
(scorer only), scored 3.671 against 3.568 (+0.103, pair SE 0.079: not resolved), and v4's 4.53 against 4.05 on \
0103 was chosen on those six episodes and is one episode. Retraining the refiner made the car faster and lost \
its braking; with no image reaching the model, the runs say nothing about learning to see a hazard."""
parents = ["GC02"]
narrative = "experiments/GC03_swerve_finetune/README.md"
external = [
  "neuroNCAP 0103 smokes and the s1 full sweep (20261008T021909-55974f), and three re-scores of that sweep with PDM terms added: run records in experiments/GC03_swerve_finetune/paddock/results/, since paddock holds only the released models' results. The first eleven are also on paddock branch record/drivejepa-camera-blind, kept, not for merging. The s1 sweep is recorded valid: true only through a runner gap that branch describes.",
  "Collections, candidate dumps and label sets (collect_dumps*, labelled_round0*, labelled_gt, labelled_round1_s2, rounds.json): under {runs} at the training site, not in git.",
  "The grader's reference, paddock's check.json, comes from candidate_check.py on paddock branch analysis/drivejepa-ncap-candidates (no PR).",
  "The runs were launched by site-local wrappers, as were the side-by-side videos and camera plots that found three of the six defects; the reproducible commands are in experiments/GC03_swerve_finetune/README.md 'Reproducing'.",
]

[[runs]]
id = "GC03.stageA"
label = "Stage A: the refiner alone on round 0"
ended = 2026-09-30
start_from = "released"
trained = ["refiner"]
frozen = ["encoder", "scorer"]
train_git_sha = "6ef2660"
notes = """Loss: min over the 32 proposals of L1 to the expert trajectory; off-camera targets dropped. Six \
epochs written (steps 928 to 5568); the 0103 smoke (paddock run 20260930T081242-bb52e8) drove step 928. Held \
out scene 0058, replaced by 0053 from v1 on: 0058 has 54 swerve ticks of 1,673, one of them frontal."""

  [runs.code]
  entry = "gallops.train.swerve"
  modules = [
    "gallops.train.swerve_data",
    "gallops.train.export",
    "gallops.train.reach",
    "gallops.expert.draw",
    "gallops.expert.grader",
    "gallops.expert.scenarios",
    "gallops.expert.check_scenarios",
  ]

  [[runs.data]]
  dataset = "neuroncap-actor-insertion"
  split = "round 0: the released model drove"
  role = "train"
  unit = "ticks"
  built_by = "gallops.expert.label"
  note = "150 episodes, 9,495 ticks: 5 reconstructed nuScenes train scenes × 3 hazard types × 10 seeds; the label set it read is not recorded"

  [[runs.data]]
  dataset = "neuroncap-actor-insertion"
  split = "round 0, scene 0058"
  role = "selection"
  note = "the sidecar's selection_split"

  [runs.checkpoint]
  model = "drivejepa_swerve"
  train_run = "swerve-stageA-round0-seen"
  step = 928
  step_unit = "optimizer_step"
  weights_sha256 = "46d27e70cf47d65f1bf1c8e14a76acfaef2c5ca36136dfdaad8c9e9fbf56f23c"
  file = "agent.ckpt"
  members = [
    "46d27e70cf47d65f1bf1c8e14a76acfaef2c5ca36136dfdaad8c9e9fbf56f23c  agent.ckpt",
    "1ab1c66126ab4cfb7bee344129ed9384fe4b2ae9730f59e081d381a52788196f  model.pt",
