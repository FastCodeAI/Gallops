  better = "higher"
  strength = "argued"
  flags = ["blind", "smoke"]
  note = "frontal 1.90 / 1.90, stationary 1.30 / 0.89, side 0.81 / 0.56; recorded valid: false"
  source = "experiments/GC03_swerve_finetune/README.md; paddock run 20260930T081242-bb52e8"

