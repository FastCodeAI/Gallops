[[checks]]
name = "The grader against paddock's verdicts"
result = "reproduces paddock's check.json exactly: 38,080 of 38,080 candidate verdicts"
decided = "every drawn target and every proposal goes through the same grader"
source = "experiments/GC03_swerve_finetune/README.md ('What was built')"

[[checks]]
name = "Defect 1: reactions taught to an off-camera hazard (found by plotting the training set)"
result = "the crossing actor sits a median 43.5° off axis against a 32.6° half-FOV; 400 of 9,495 ticks taught an evasion of something outside the frame"
decided = "every tick records the hazard's bearing; reactive targets that cannot see their hazard are dropped"
source = "experiments/GC03_swerve_finetune/README.md (defect 1)"

[[checks]]
name = "Defect 2: a swerve from t = 0 held to the horizon (found by watching the closed-loop video)"
result = "at 10 Hz the target re-commanded full displacement at once on every tick; the model threw the wheel over at first sight"
decided = "the drawn plan holds its lane, then moves, then recovers"
source = "experiments/GC03_swerve_finetune/README.md (defect 2)"

[[checks]]
name = "Defect 3: an undrivable recovery (found by probing a state round 0 never visits)"
result = "a plan for a car 3 m off the logged path began with a 3 m jump: 24.5 m/s², six times the module's own comfort limit, taught after every evasion"
decided = "rejoin() eases the correction: 1.7 m/s², back in lane by 4 s"
source = "experiments/GC03_swerve_finetune/README.md (defect 3)"

[[checks]]
name = "Defect 4: swerving where braking was available (found by measurement)"
result = "braking alone was clear on 197 of 197 sampled stationary swerve ticks and 10 of 10 side ones, every one taught as a swerve"
decided = "brake for what is not closing on the ego, swerve for what is (closing-speed split near −3.0 m/s): the v2 expert"
source = "experiments/GC03_swerve_finetune/README.md (defect 4)"

[[checks]]
name = "Defect 5: the scorer taught to want the opposite of the expert"
result = "score_target scored a clear swerve 1.00 and a clear brake 0.75 on every tick; swerve-first to brake-first moved 1,200 targets and changed behaviour not at all; a cap at the expert's distance tied brake with full speed (v3)"
decided = "the progress term peaks at the expert's distance and falls on both sides (v4): slowing on brake ticks −26% → +47%"
source = "experiments/GC03_swerve_finetune/README.md (defect 5)"

[[checks]]
name = "Defect 6: every scorer target graded from the wrong pose (found by a creep check that could not be true)"
date = 2026-10-06
result = "Referee cached the ego pose once per episode, 14–16 m off; re-grading round 0 that way flipped 19.5% of 3,776 stationary, 36.6% of 3,008 frontal and 1.6% of 3,808 side hit/clear verdicts. In every run that trained the scorer: v1 to v4"
decided = "episode_context returns the tick's own pose; no run trains until the preflight shows the trainer's grading reproduces the labels exactly; v4's recipe retrained under the fix (v4fix)"
source = "experiments/GC03_swerve_finetune/README.md (defect 6); CLAUDE.md ('Before any training run')"

[[checks]]
name = "Preflight fidelity: the rebuilt past (506 round-0 ticks)"
result = "the first real run was refused by an absolute 5 cm limit; measuring why found that an episode's first half second needs a priming frame the logger never saved: rebuilt pick a median 0.4–0.5 m (p90 2.4 m) from the driven one, against 0.10 m once the real frame exists; about 7% of every round's ticks"
decided = "unrebuildable ticks are dropped before counting and recorded by kind (notes.unrebuildable); a set with more than 10% is refused; fidelity gates the median at 1% of travel (measured 0.29%) and the p90 at 10%"
source = "experiments/GC03_swerve_finetune/README.md; CLAUDE.md ('Before any training run')"

[[checks]]
name = "Camera-blind: did any image reach the model?"
date = 2026-10-12
result = "no: the trainer's inputs (swerve_data.py) and paddock's adapter placed the cameras relative to nuScenes' LIDAR_TOP, yawed −90°; a black frame gave the identical plan, in every run and every collection here"
decided = "fixed in camera_extrinsics (paddock half: #62); the preflight refuses a model a blanked camera does not move; these runs say nothing about learning to see a hazard"
source = "experiments/GC03_swerve_finetune/README.md (correction)"

[[checks]]
name = "Ticks mixed within a batch"
date = 2026-10-14
result = "every run here trained at --batch 8; the vendor's spatial cross-attention picks each camera's queries from batch element 0's mask for the whole batch"
decided = "every forward pass is one tick (TICKS_PER_PASS in swerve_data.py); --batch refuses anything else"
source = "experiments/GC03_swerve_finetune/README.md (correction)"
