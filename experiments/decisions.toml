[[decision]]
id = "D17"
date = 2026-10-26
short = "Momentum-aware selection on by default"
decision = """Paddock's Drive-JEPA adapter selects with momentum by default, as the published method does; Drive-JEPA \
baselines from here on include it."""
by = ["Siddesh"]
source = "paddock 567710e and 681dc26 (#95)"

[[decision]]
