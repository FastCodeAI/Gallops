date = 2026-10-28
short = "KITScenes exp 3 fails the gate"
decision = """The encoder + generator + scorer checkpoint trained on KITScenes fails the gate (NAVSIM, Bench2Drive and \
AlpaSim regress); its checkpoints stay a research record, not for deployment."""
by = ["Siddesh"]
evidence = ["H07.exp3"]
source = "branch train/drivejepa-kitscenes, docs/drivejepa-kitscenes.md"

[[decision]]
