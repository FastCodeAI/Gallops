# H02 -- the smallest valid regression gate: subset size per benchmark from the spread of past paired runs.
# Owner Naren. Sources: "Renesas Progress and Plan", 22 Oct 2026 (Next steps item 2; Regression gate section),
# paddock docs/gate.md and tools/gate_smoke/*.toml on main, the paddock PRs named below, and the 20 Oct
# run's own files (manifest.toml, each run.json's provenance). Numbers are copied, never re-derived.

schema = 1
id = "H02"
title = "Smallest valid gate: subset size per benchmark from the spread of past paired runs"
short = "Smallest valid gate"
track = "enabler"
owner = "Naren"
benchmarks = ["navsim", "kitscenes", "nuscenes", "neuroncap", "bench2drive", "alpasim"]
started = 2026-10-20
ended = 2026-10-21
status = "done"
verdict = "none"
priority = 2
question = """How small can each benchmark's gate subset be and still catch a change worth catching? \
Measured as the smallest drop each subset detects at 80% power, from the spread of past paired runs \
(CPU and existing results only), so that every checkpoint can go through the gate."""
learned = """Smallest drop each subset detects (80% power): neuroNCAP closed tier 0.73 for a small change \
and 2.85 for a big one, out of 5; its quick tier 2.5 / 6.7, a pipeline check only; NAVSIM about 0.0035; \
KITScenes 0.51 m for a big change; Bench2Drive only 17–38 points; AlpaSim about 0.23, argued. Decided \
21 Oct: the subset sizes stay, every verdict prints its MDE, and each benchmark's own score decides. The \
first timed run (20 Oct, released against itself) took 2 h 40 min, the quick tier 19 min, and matched its \
baselines to the last digit: HOLD."""
narrative = "experiments/H02_smallest_valid_gate/README.md"
external = [
  "The MDE table exists only on the team page (Renesas Progress and Plan, 22 Oct 2026); paddock records Bench2Drive's 17-38 points in tools/gate_smoke/bench2drive.toml and docs/gate.md.",
  "The 20 Oct run: paddock docs/gate.md ('The tiered smoke, timed'), state dir {runs}/gate/smoke/drivejepa-released-timing-20261021/ under paddock's runs root.",
  "Later gate changes: paddock PRs #100, #105, #110, #111, #113, #114, #115, #116, #120 (docs/gate.md on main).",
]

[[runs]]
id = "H02.mde"
label = "smallest detectable drop (MDE, 80% power, two-sided 5%) per gate subset, from the spread of existing paired runs"
ended = 2026-10-21
notes = "Cost: CPU, existing results. A small change is a finetune of the same model; a big change is one that changes what the model sees (page). Bench2Drive's 17–38 points and the not-adopted neuroNCAP alternative are under checks: a range is not one number."

  [[runs.results]]
  bench = "neuroncap"
  metric = "MDE, small change (closed tier, 6 pairs × 3 seeds)"
  value = "0.73"
  better = "lower"
  n = 6
  unit = "scenario pair"
  strength = "argued"
  flags = ["no-record"]
  headline = true
  note = "out of 5; measured from past paired runs per the page, not in either repo"
  source = "Renesas Progress and Plan, 22 Oct 2026 (Next steps item 2; Regression gate subset table)"

  [[runs.results]]
  bench = "neuroncap"
  metric = "MDE, big change (closed tier, 6 pairs × 3 seeds)"
