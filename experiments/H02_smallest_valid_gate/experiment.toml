  better = "lower"
  n = 6
  unit = "scenario pair"
  strength = "argued"
  flags = ["no-record"]
  note = "out of 5"
  source = "Renesas Progress and Plan, 22 Oct 2026 (Next steps item 2; Regression gate subset table)"

  [[runs.results]]
  bench = "neuroncap"
  metric = "MDE, small change (quick tier, 0103 × 3 shapes, 1 seed)"
