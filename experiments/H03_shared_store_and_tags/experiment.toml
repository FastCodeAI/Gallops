question = """We could not run each other's models twice in the week of 19 Oct. One shared folder and \
group for the three of us, and a tag on every checkpoint (its weights sha256) with full metadata, so \
that anyone can run anyone's checkpoint and every result traces to one. Gallops' checkpoint file \
already records step, commit and training data; the group needs the machine admin's OK."""
learned = """So far: the paddock account and a paddock group holding the three of us exist on shakaal; \
paddock's gate queue (#109, 26 Oct) copies every submitted checkpoint into a shared store named by its \
sha256. This registry pins every checkpoint by weights_sha256 with model, run, step, data and code, and \
`gallops experiments checkpoint` prints that block from a checkpoint directory. Not every past checkpoint \
has its digest recorded: those without one say so, and a gated checkpoint without one fails make check."""
