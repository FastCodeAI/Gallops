<text text-anchor="start" x="175" y="-140.5" font-family="Helvetica" font-weight="bold" font-size="10.00">the decision chain, read in this order: a step is read as a claim only if every step above it holds</text>
<text text-anchor="start" x="74" y="-121.5" font-family="Helvetica" font-weight="bold" font-size="10.00">0</text>
<text text-anchor="start" x="121" y="-121.5" font-family="Helvetica" font-weight="bold" font-size="10.00">O − C</text>
<text text-anchor="start" x="149" y="-121.5" font-family="Helvetica" font-size="10.00">, under B&#45;2&#45;1</text>
<text text-anchor="start" x="238" y="-120.8" font-family="Helvetica" font-size="9.00">is there room for any agent input to a learned planner?</text>
<text text-anchor="start" x="497" y="-120.8" font-family="Helvetica" font-size="9.00">phase 1&#39;s read; the owner decides whether to go on</text>
<text text-anchor="start" x="74" y="-102.5" font-family="Helvetica" font-weight="bold" font-size="10.00">1</text>
<text text-anchor="start" x="121" y="-102.5" font-family="Helvetica" font-weight="bold" font-size="10.00">HD − D</text>
<text text-anchor="start" x="156" y="-102.5" font-family="Helvetica" font-size="10.00">, under B&#45;2&#45;1</text>
<text text-anchor="start" x="238" y="-102.8" font-family="Helvetica" font-weight="bold" font-size="9.00">the primary:</text>
<text text-anchor="start" x="291" y="-102.8" font-family="Helvetica" font-size="9.00"> does the hidden layer add to the decoded list?</text>
<text text-anchor="start" x="497" y="-101.8" font-family="Helvetica" font-size="9.00">every seed, beyond D&#39;s seed range and 2 SE</text>
<text text-anchor="start" x="74" y="-83.5" font-family="Helvetica" font-weight="bold" font-size="10.00">2</text>
<text text-anchor="start" x="121" y="-83.5" font-family="Helvetica" font-weight="bold" font-size="10.00">HD − C</text>
<text text-anchor="start" x="238" y="-82.8" font-family="Helvetica" font-size="9.00">does the side&#45;car help the planner at all?</text>
<text text-anchor="start" x="497" y="-82.8" font-family="Helvetica" font-size="9.00">H15&#39;s rule against C</text>
<text text-anchor="start" x="74" y="-64.5" font-family="Helvetica" font-weight="bold" font-size="10.00">3</text>
<text text-anchor="start" x="121" y="-64.5" font-family="Helvetica" font-weight="bold" font-size="10.00">HD against R</text>
<text text-anchor="start" x="238" y="-63.8" font-family="Helvetica" font-size="9.00">does it meet, or beat, the release&#39;s 87.78?</text>
<text text-anchor="start" x="497" y="-63.8" font-family="Helvetica" font-size="9.00">low end ≥ −0.4 (meets) · above 0 (beats), every seed</text>
<text text-anchor="start" x="74" y="-45.5" font-family="Helvetica" font-weight="bold" font-size="10.00">4</text>
<text text-anchor="start" x="121" y="-45.5" font-family="Helvetica" font-weight="bold" font-size="10.00">H6 − HD</text>
<text text-anchor="start" x="238" y="-44.8" font-family="Helvetica" font-size="9.00">can a learned reader replace the analytic geometry?</text>
<text text-anchor="start" x="497" y="-44.8" font-family="Helvetica" font-size="9.00">H15&#39;s rule against HD</text>
<text text-anchor="start" x="74" y="-26.5" font-family="Helvetica" font-weight="bold" font-size="10.00">5</text>
<text text-anchor="start" x="121" y="-26.5" font-family="Helvetica" font-weight="bold" font-size="10.00">H3 − H6</text>
<text text-anchor="start" x="238" y="-25.8" font-family="Helvetica" font-size="9.00">does an earlier layer carry more?</text>
<text text-anchor="start" x="497" y="-25.8" font-family="Helvetica" font-size="9.00">only if H3 runs at 3 seeds</text>
<text text-anchor="start" x="74" y="-8.3" font-family="Helvetica" font-weight="bold" font-size="9.00">reported, never claimed:</text>
<text text-anchor="start" x="178" y="-8.3" font-family="Helvetica" font-size="9.00"> every other contrast · every comparison across recipes · EC within ± 0.02 of R, or flagged · the 32&#39;s spread: no collapse beyond −20%</text>
