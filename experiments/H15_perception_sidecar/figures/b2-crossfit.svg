<text text-anchor="start" x="101" y="-43" font-family="Helvetica" font-weight="bold" font-size="10.00">Why not the full seed&#45;k side&#45;cars, as B&#45;1 read?</text>
<text text-anchor="start" x="101" y="-33.8" font-family="Helvetica" font-size="9.00">decoded agents are in metres and classes, the same for any side&#45;car; hidden states are each model&#39;s own coordinates.</text>
<text text-anchor="start" x="101" y="-24.8" font-family="Helvetica" font-size="9.00">A reader trained on the fold side&#45;cars&#39; slots cannot read another model&#39;s. So the fold side&#45;cars are read at test too.</text>
<text text-anchor="start" x="101" y="-15.8" font-family="Helvetica" font-weight="bold" font-size="9.00">Recorded as departures from B&#45;0&#39;s Q8:</text>
<text text-anchor="start" x="270" y="-15.8" font-family="Helvetica" font-size="9.00"> the side&#45;car&#39;s seed is no longer sampled (all five are seed 0, select F1 0.700–0.708</text>
<text text-anchor="start" x="101" y="-6.8" font-family="Helvetica" font-size="9.00">against the full seeds&#39; 0.713–0.720), and arm D here is not B&#45;1&#45;3&#39;s input</text>
</g>
