# H15 -- a perception side-car on frozen Drive-JEPA (3D boxes + each agent's 1 s path), tested as an
# input to the scorer, as an input to the refiner, and against LoRA on the ViT. Owner Shreedhar.
# Sources: the plan, docs/drivejepa-perception-sidecar.md; every number below will be copied from the
# run files this folder names, never re-derived.
# The rules for every field are in docs/experiments.md; src/gallops/experiments.py validates them.

schema = 1
id = "H15"
title = "A perception side-car on frozen Drive-JEPA: 3D boxes and each agent's 1 s path, tested as an input to the scorer, to the refiner, and against LoRA on the ViT"
short = "Side-car: scorer, refiner, ViT LoRA"
track = "hypothesis"
owner = "Shreedhar"
benchmarks = ["navsim", "nuscenes"]
started = 2026-11-03
status = "running"
verdict = "none"
question = """Drive-JEPA's planner reads image tokens but no explicit account of the other agents. Can a \
small network trained on the frozen ViT's tokens detect them in 3D and predict each one's next second, \
and when its decoded agents are handed to the scorer or the refiner, does the plan improve, how much of \
the scorer or refiner must change to use them, and does LoRA on the ViT do better than the frozen tap? \
The scorer's use of named agents is also the route to explanations that can be checked."""
hypothesis = """H-A: a side-car of about 4 M parameters on the frozen tokens beats no-camera and \
kinematic baselines at detecting agents (recall and precision at 2 m) and at their 1 s paths. H-B1: given \
its decoded agents, a scorer picks better plans (EPDMS of the pick on held-out navtrain logs) than the \
identical scorer adaptation without them (arm C), by more than C's seed range and twice the paired, \
log-clustered SE on every seed; tested with the scorer frozen behind an adapter, with LoRA, fully \
fine-tuned, and replaced. H-B2: the same for the refiner's proposals (best-of-32 EPDMS). H-B3: LoRA on \
the ViT beats the frozen tap. H-info: shuffled agents (S) do not recover the gain and ground-truth agents \
(O) are at least as good. Refuted per question if F does not beat C under any mode; the side-car claim \
is refuted if it does not beat its baselines."""
predictions = "experiments/H15_perception_sidecar/PREDICTIONS.md"
learned = """The first pass (3-4 Nov) is judged inconclusive by its owner and is being redone from a revised plan, \
Part A first, one reviewed step at a time (D20); what it reported, open loop: on NAVSIM navtrain (in-sample for \
the release) a 4.39 M side-car on Drive-JEPA's \
frozen ViT output detects agents ahead (recall 0.63, precision 0.74 within 30 m, three seeds), follows them \
for a second a little better than constant velocity, transfers to nuScenes untrained (vehicle recall 0.48), \
and is still data-limited. Its agents, handed to the scorer (four modes) or to the refiner (three), change \
nothing beyond noise, and ground-truth agents neither: the release's pick already scores NC and TTC 0.996 on \
these logs. LoRA on the ViT's last blocks adds nothing. Fitting the scorer to navtrain costs 0.2-0.4 m at \
3 s on nuScenes, with or without agents. The agent a scorer names for its pick is faithful (deleting it moves \
the pick 3-5x as often as a random one). No closed loop, no gate."""
narrative = "experiments/H15_perception_sidecar/README.md"
parents = ["H04"]
external = [
  "Run outputs (checkpoints, per-epoch metrics, reports, logs) were deleted on 4 Nov 2026 at the owner's request, ahead of a rerun after review; every number in this record was copied from them before. The caches the runs read are kept under {runs}/drivejepa_perception.",
]

