# H15 -- carrying the planner's own per-path outputs across moments makes the picker steadier and earlier.
# Owner Naren.
# Sources: Naren's plan of 5 Nov 2026 (paddock checkout, memory-layer-plan.md, "Rewritten 5 Nov 2026",
# appendix :143-280), Siddesh's review MEMORY_PLAN_V2_REVIEW.md (paddock-sid/memory) and Sid's decisions
# D10-D17 of 5 Nov, which are pinned below. Numbers about the saved data are from H05.r1's cache.
# The rules for every field are in docs/experiments.md; src/gallops/experiments.py validates them.

schema = 1
id = "H15"
title = "Carrying the planner's output embeddings across moments makes the picker steadier and earlier"
short = "Prediction memory"
track = "hypothesis"
owner = "Naren"
contributors = ["Siddesh"]
benchmarks = ["navsim", "neuroncap", "bench2drive", "alpasim", "kitscenes", "nuscenes"]
started = 2026-11-05
status = "planned"
verdict = "none"
question = """Released Drive-JEPA decides every moment from scratch: its 32 proposals and their scores \
are recomputed from one moment (now and 0.5 s ago) with nothing kept. On saved data (40 val logs, \
released model, momentum off, predicted scores rather than true grades) back-to-back picks are more \
than 1 m apart on 45% of moments while a path 0.34 m from the old pick is still on the menu, and the \
top two predicted scores differ by 0.003. Does a small memory of what the planner and picker concluded \
at earlier moments settle those near-ties the right way, and brake no later on the side crashes?"""
hypothesis = """A selective state-space memory per path, fed that path's planner output embedding \
(the scorer input, 256 numbers), its six released score logits and the ego status, and carried to the \
closest proposal of the next moment (ego-motion aligned; no match beyond 2 m starts empty), nudges the \
released final score; the camera never reaches it and everything released stays frozen, so the 32 \
proposals are the released ones and a zero nudge reproduces released picks. Arms, same size, data order \
and training (3 seeds each): (a) memory carried, length 1, 2 or 4 moments chosen on the selection set, \
warm-up 1-16; (b) the same layer wiped every moment; (c) released. Momentum is off for all three arms \
offline and on for all three in the gate. Expected: (a) picks better-graded paths than (b) on the 214 \
val logs, with fewer flips and better two-frame comfort, nothing regresses against released on the \
gate, and on neuroNCAP's side pairs (a) scores above (b) and brakes no later. Refuted at the go/no-go \
unless the 3-seed mean of (a) - (b) in true PDM grade of the pick is above 0 with a CI excluding 0 \
(flips and comfort are secondary, reported with CIs); after the gate unless (a) beats (b), nothing \
regresses against released and braking starts no later. The effect size is stated in PREDICTIONS.md \
once the val logs are graded, before training."""
predictions = "experiments/H15_prediction_memory/PREDICTIONS.md"
narrative = "experiments/H15_prediction_memory/README.md"
parents = ["H05"]  # the cache H05.r1 built is this experiment's input data

# Pinned before anything runs (Sid, 5 Nov; Naren's agreement assumed on D10-D12):
#   D10 momentum OFF for arms a, b, c offline; ON for every arm in the gate.
#   D11 the motivation numbers (0.003 gap, 45 % flips) are predicted scores with momentum off; they are
#       re-measured after grading with true grades and momentum-on states.
#   D12 navtest re-grade check: grade without the anchors load; compare shared sub-scores with run
#       navsim/drivejepa/20261023T202240-de2f00 within a tolerance set from the 200-token timing run.
#   D15 go/no-go: P1 (mean true grade of the pick, (a) vs (b)) is primary and must have a CI excluding 0;
#       flips and comfort are secondary, reported with CIs, each with its own n; 3 seeds, the bootstrap
#       is of the seed mean, and each seed is shown.
#   D16 memory lengths 1, 2, 4 ("no limit" dropped); warm-up 1-16.
#   D17 grading on 4 cores (taskset -c 0-3, 4 workers); training stays on 2 cores.
#
# Code still to come (plan appendix, "Gallops PR 2"): gallops.memory.align, .grade, .model, .train,
# .evaluate; each is claimed by the run that first uses it. The adapter record goes under
# experiments/H15_prediction_memory/paddock/ and is copied into a throwaway paddock checkout for the
# gate; paddock gets no PR (paddock rule of 4 Nov: released checkpoints only).

[[runs]]
id = "H15.r1"
label = "true grades of the 32 released proposals at every graded navtrain moment"
started = 2026-11-05
start_from = "H05.r1"
frozen = ["all of Drive-JEPA: encoder, generator and scorer"]
notes = """The vendor's training-time grader (compute_navsim_score: simulate, score_proposals, \
after_score_proposals) on H05.r1's cached proposals with the train metric cache, without the anchors \
load: the strict grade H15 trains on (Sid D22). Also stored per path: lane keeping and traffic light \
the benchmark's way (lane keeping checked every 0.1 s, not 0.5 s; either set to 1 where the human \
driver's own path fails it), and the human path's own scores. States keep x, y relative to a float64 \
origin. Navtest check (200 picks of navsim/drivejepa/20261023T202240-de2f00 against its CSV): the \
five gates-and-comfort sub-scores and the forgiving lane keeping and traffic light agree exactly on \
200/200, progress within 1e-4 on 199; strict lane keeping (33) and traffic light (3) differ only \
ours 0 against the CSV's 1, all explained: 30 by the human filter, 6 by the coarse 0.5 s lane check, \
and the progress case by the human filter (the human fails driving direction). Tolerance (Sid D23) \
set on those same 200 tokens. Batches: val (214 logs), selection (100), rest (878)."""

  [runs.code]
  modules = ["gallops.memory.grade"]
  as_run = ["experiments/H15_prediction_memory/scripts/"]
