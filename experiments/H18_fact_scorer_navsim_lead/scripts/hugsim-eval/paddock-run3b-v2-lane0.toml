# HUGSIM eval of Run 3A (26 Oct, user: "can we evaluate our RUN3A on hugsim"), lane 0: wajepa_dj_run3a (epoch 13, locked
# pick) served from worktree rerank-native, same setup as the 22 Oct models (command only, 2 Hz, PR #57 controller,
# identity lidar2ego), but the four cameras it reads are rendered (front, front-left, front-right, back).
# WAJEPA_DJ_FOLLOW as in its B2D runs; HUGSIM only sends right/left/straight, so it changes nothing here.
site = "fastcode-shakaal-navvrat-hugsim-run3b-v2"
[roots]
repos   = "{data.hdd}/workspace/Navvrat/work/paddock-repos"
runs    = "{data.p3_renesas}/hugsim-eval"
weights = "{data.paddock_dump}/weights"
[gpu]
budget_gb = 96
[models.run3b_v2]
env = { DRIVEJEPA_RECORD_DIR = "{data.p3_renesas}/hugsim-eval/run3b_v2/rec_lane0", WAJEPA_DJ_FOLLOW = "straight", DRIVEJEPA_RECORD_FEATS = "0" }
