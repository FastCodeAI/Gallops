# H18 -- the sub-score agent-look model's architecture trained from scratch on NAVSIM + LEAD with a per-waypoint fact
# scorer (called Run 3B v2 while it ran). Owner Navvrat.
# Sources: specs/run3b_v2_spec.md (Navvrat's spec of 19 Nov, verbatim); the trainer's held-out reports and train log, the
# navtest CSV, the gate's verdict and compare JSONs (all listed with sha256 in POINTERS.md); numbers copied, never re-derived.

schema = 1
id = "H18"
title = "The sub-score agent-look model's architecture, trained from scratch on NAVSIM + LEAD with a per-waypoint fact scorer"
short = "Fact scorer, NAVSIM + LEAD"
track = "hypothesis"
owner = "Navvrat"
benchmarks = ["navsim", "kitscenes", "nuscenes", "neuroncap", "bench2drive", "alpasim", "offline"]
started = 2026-11-18
status = "running"
verdict = "none"
question = """The sub-score agent-look model (H04) learns its pick from NAVSIM's sub-scores, so it trains on NAVSIM \
alone. A scorer that predicts what happens along each path, waypoint by waypoint (hit something, off road, left the \
route, red light, stop sign, wrong way, comfort; metres gained, lane offset, closeness, cut-in braking), can be labelled \
on CARLA (LEAD) as well as on NAVSIM. What does the same architecture do when it is trained end to end on both, with a \
fresh LoRA on the encoder and that fact scorer choosing among its 32 proposals?"""
hypothesis = """Stated by this record from the spec's 'What' line, not by the spec, which sets no size and no pass \
mark: training H04's architecture end to end on NAVSIM and LEAD together, with the per-waypoint fact scorer picking, \
gives a model that drives NAVSIM as H04 does while the same weights learn CARLA's scenes. The record's evidence against it \
would be a regression against H04 or released Drive-JEPA on NAVSIM; Navvrat decides what counts."""
predictions = "none: the spec (specs/run3b_v2_spec.md, Navvrat's of 19 Nov) sets no pass marks ('No pass marks. Report numbers next to run 3A's where we already have them'), and no PREDICTIONS.md was written before the run"
learned = """So far, on navtest (12,146 scenes) the fact-scorer model scores EPDMS 86.35 with NAVSIM's human filter: \
below the sub-score agent-look model (87.30; paired -0.95, 95 % over logs [-1.79, -0.19]) and released Drive-JEPA \
(87.78; -1.43 [-2.18, -0.66]), above the 4-camera planner (85.27; +1.08 [+0.18, +2.09]). Collisions and \
time-to-collision are its best of the four (NC .988, TTC .983), extended comfort far higher (EC .655 against .406), \
ego progress and drivable area lower (EP .823 against .900, DAC .966 against .984). The regression gate, run by hand, \
says FAIL against released Drive-JEPA: NAVSIM REGRESSION (0.857 -> 0.807, t -6.05), nuScenes GAIN, KITScenes and \
neuroNCAP NEUTRAL. On AlpaSim (10 scenes) its scene score is 0.132 against released 0.416 (NEUTRAL, t -1.69) and \
H04's 0.439 (REGRESSION, t -2.29), with progress 0.174 against 0.473. On Bench2Drive's 7 gate routes it scores 92.88 against released 59.04 (GAIN, t 2.99)."""
parents = ["H04"]
narrative = "experiments/H18_fact_scorer_navsim_lead/README.md"
external = [
  "Paddock's run3b_v2 adapter: uncommitted files in two local paddock worktrees (gate-oct27 for the gate, gate-oct27-alp for its AlpaSim subsets), as H04's; copies in paddock/ of this folder, sha256 in AS_RUN_SHA256.txt.",
  "The checkpoint, the train log, the per-pass held-out reports, the navtest CSV and the gate's verdict files are off-repo at the training site; POINTERS.md lists them with bytes and sha256.",
  "The fact labels (carla_full_v1 + carla_full_v1_vru, the NAVSIM pool), LEAD's inputs (lead_inputs_v2, its ego-status sidecar and auxiliary targets) and the pool pack (pack_v2) are built data from earlier work at the training site, not built by this record's code; POINTERS.md names them.",
]

[[runs]]
id = "H18.fact-scorer"
label = "The fact-scorer model (called Run 3B v2 while it ran): WA-JEPA ViT-L + fresh LoRA, H04's agent decoder and planner from scratch, per-waypoint fact scorer, NAVSIM + LEAD; last step of a 48 h schedule"
started = 2026-11-19
ended = 2026-11-20
start_from = "released WA-JEPA encoder (base frozen, fresh LoRA with B = 0); agent decoder, planner, path reader and heads from scratch: nothing loaded from H04 or Phase 1"
trained = ["LoRA r32 / alpha 32 on Q and V of all 24 encoder blocks (lr 0.1 x the heads')", "agent decoder (300 slots x 3 layers, detection loss on both datasets)", "planner (32 proposals x 8 waypoints, 4 rounds, footprint look + agent look; min-L1 to the expert + 0.5 x teachers)", "H04's auxiliary heads (key agents, ego areas, map auxiliary targets; LEAD)", "path reader: 7 yes/no + 4 number facts per waypoint, ranking loss weight 0.1", "expert's-metres head"]
frozen = ["WA-JEPA ViT-L base weights"]
train_git_sha = "548bb82"
params_trained_m = 20.62
gpu_hours = 30.4
notes = "Spec: Navvrat's of 19 Nov ~02:15, verbatim in specs/run3b_v2_spec.md; earlier drafts (18 Nov, 19 Nov ~02:00) were superseded before any long run. Trained 19 Nov 03:15 to 20 Nov 09:41 on one GPU shared with other users (scripts/run3b/v2/probe_then_launch.sh, after a 5-step eval-path probe): 23,859 optimizer steps, 7.1 passes of 3,358 steps; batch 64 = 32 NAVSIM + 32 LEAD drawn with replacement by weight (stop-sign frames x2, LEAD frames with a pedestrian or cyclist in our path x4). Adam, heads lr 1e-4, LoRA 1e-5, 500-step warm-up, cosine to 0 over the run, one backward and one step per batch. Teacher forcing on the agent look: share 1.0 for the first pass, then linear to 0.2 at 60 % of the run, noise 0.3 m / 3 deg / 0.5 m/s. Augmentation: angle 1.0 deg, position 0.05 m, zoom x[1, 1.1] on half the samples, one camera dropped in 10 %. Facts labelled live on the GPU for every path the planner proposes (scripts/run3b/gpulab); 0 label errors over the run. Score T4, gamma 0.9, P 0.108; pick = argmax over the 32 of the score from predicted facts with the expert's metres from the head. Step-0 check: the encoder's tokens on 200 NAVSIM held-out samples against H04's cache, cosine median 0.992 (local JPEG re-encodes; Navvrat: 'use local re-encodes'). Held-out reports at step 2,000 and after every pass on 1,008 NAVSIM + 1,008 LEAD samples, the same draw each time. The checkpoint evaluated is the last step, the end of the schedule: no checkpoint was selected (pass 6 had the highest held-out pick, 0.876 against 0.866, n 1,008 each). The code was not committed when it ran, so train_git_sha is the Drive-JEPA tree's upstream commit; the code as run is in scripts/, AS_RUN_SHA256.txt holds each file's sha256 as it ran."

