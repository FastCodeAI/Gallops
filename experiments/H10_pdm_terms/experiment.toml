DAC and EP; nuScenes NC, EP and C; Bench2Drive NC and EP; KITScenes and nuPlan EP and C. Each \
benchmark's own score keeps deciding (21 Oct). Re-scored, the camera fix is NEUTRAL on neuroNCAP's score \
and composite but worse on comfort beyond t crit."""
