not the same scale: 0.85 on nuScenes and 0.85 on NAVSIM are different claims."""
learned = """paddock #102, merged 22 Oct: NAVSIM's five terms print under every gate pair, as far as each \
benchmark can measure them, and never change a verdict. neuroNCAP has all five by NAVSIM's rules, its \
