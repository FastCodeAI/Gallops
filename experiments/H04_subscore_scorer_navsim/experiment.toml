# H04 -- training the scorer on the sub-scores closes the base's NAVSIM gap (Navvrat, with Siddesh).
# Priority 4 on the 21 Oct list. Its two runs (the agent decoder and Run 3A) are mapped here by inference:
# the branch never names the hypothesis, and Run 3A changes more than the scorer.
# Sources: docs/drivejepa_wajepa.md, recipes/drivejepa_wajepa.toml and overlay/{agent_decoder,run3a}.json
# on branch drivejepa-wajepa/run3a (numbers copied, never re-derived); the item's wording and motivation
# from the team's gap-review page (22 Oct).

schema = 1
id = "H04"
title = "Training the scorer on the sub-scores closes the base's NAVSIM gap"
short = "Sub-score scorer, NAVSIM gap"
track = "hypothesis"
owner = "Navvrat"
contributors = ["Siddesh"]
benchmarks = ["navsim", "bench2drive", "hugsim"]
started = 2026-10-22
status = "running"
verdict = "none"
priority = 4
question = """The 4-camera base trails released Drive-JEPA on navtest (0.820 against 0.845 on Navvrat's \
eval), which fails the gate's NAVSIM bar (0.007). 72% of its failing scenes are a wrong pick with a good plan \
available, and drivable area is about 1.4 points of the gap. The released recipe trains the scorer on the \
final score alone. Does training it on the sub-scores close the gap?"""
hypothesis = """Retraining the base's scorer with NAVSIM's sub-scores switched on, targeting drivable area, \
closes the base's NAVSIM gap to released Drive-JEPA. Refuted if the retrained base still fails the gate's \
NAVSIM pair against released Drive-JEPA: the item decides whether the base passes the gate on NAVSIM."""
predictions = "none: Run 3A followed a spec (the user's of 23 Oct, revision 2) that is not committed, the branch has no PREDICTIONS.md, and its mapping to this item is an inference"
learned = """So far, Run 3A narrowed the base's navtest gap (EPDMS 85.27 -> 87.30, paired +2.03 [+1.65, \
+2.44]) but stays behind released Drive-JEPA (87.78; paired -0.49 [-0.84, -0.11]); drivable area rose \
.972 -> .984 (released .986). It also added an agent decoder and an agent look in place of the global look, \
so the gain is not the sub-score heads' alone; no scorer-only arm is recorded, and the gate has not run."""
parents = ["H01"]
narrative = "docs/drivejepa_wajepa.md"
branch = "drivejepa-wajepa/run3a"
external = [
  "Paddock's wajepa_dj_run3a adapter: on 27 Oct only uncommitted files in one local paddock worktree (rerank-native), per docs/drivejepa_wajepa.md; no paddock ref carries it through 3 Nov, so no gate run exists.",
  "The agent decoder's and Run 3A's epoch checkpoints, the lane centrelines and the rear-safe teacher list are off-repo at the training site ({runs}/drivejepa_wajepa/, beside the metric cache); no sha256 is recorded on the branch.",
]

[[runs]]
id = "H04.agent-decoder"
label = "the agent decoder Run 3A loads: a sweep of slots x layers; D = 300 slots x 3 layers, epoch 11 of 12 kept"
started = 2026-10-22
ended = 2026-10-23
start_from = "scratch, on H01.run2's frozen WA-JEPA token cache"
trained = ["agent decoder (DETR3D-style slots on the token rays)"]
frozen = ["WA-JEPA encoder (tokens cached)"]
params_trained_m = 4.25
notes = "† Mapped to H04 by inference: it exists to feed Run 3A's agent look. Sweep on the 51 held-out logs (22-23 Oct): 64 x 3, 128 x 3, 64 x 6, 128 x 6, 300 x 3. AdamW 2e-4, weight decay 0.01, batch 64, fp16, cosine over 12 epochs, gradient clip 35. Targets: every vehicle, pedestrian and cyclist within 32 m at time t, nearest 64 kept; navtest never read. D trained 23 Oct 15:56-17:11; its two files are the ones it trained with (verified by timestamps and the code-agent-decoder tree's diff). Checkpoint {runs}/drivejepa_wajepa/agent_decoder/ckpts_D_q300_l3/epoch_11.pt, no sha256 recorded."

  [runs.code]
  recipe = "recipes/drivejepa_wajepa.toml#agent-decoder"
  modules = [
    "gallops.drivejepa_wajepa.code",
    "gallops.drivejepa_wajepa.extract_agents",
    "gallops.drivejepa_wajepa.agent_targets",
    "gallops.drivejepa_wajepa.agent_decoder_data",
    "gallops.drivejepa_wajepa.train_agent_decoder",
  ]

  [runs.code.upstream]
  repo = "Drive-JEPA (linhanwang/Drive-JEPA)"
  commit = "548bb82"
  overlay = "recipes/drivejepa_wajepa/overlay/agent_decoder.json"

  [[runs.data]]
  dataset = "navsim"
  split = "navtrain minus the 51 held-out logs"
  role = "train"
  unit = "samples"

  [[runs.data]]
  dataset = "navsim"
  split = "navtrain, 51 held-out logs (sha1(log) % 20 == 0)"
  role = "selection"
  n = 4457
  unit = "samples"
  scene_list = "recipes/drivejepa_wajepa/heldout_logs.txt"
  note = "chose the slot count and depth, and reports the metrics below"

  [[runs.results]]
  bench = "offline"
  metric = "agent detection recall at 2 m (held-out logs)"
  n = 4457
  unit = "sample"
  value = "0.497"
  better = "higher"
  strength = "moderate"
  flags = ["selected-on-report", "adapted"]
  note = "precision 0.748 at 2 m; recall of moving vehicles within 20 m 0.849; epoch 11 of D"
  source = "docs/drivejepa_wajepa.md, 'The agent decoder'"

[[runs]]
id = "H04.run3a"
label = "Run 3A: agent decoder D, agent look (global look removed), 12 scorer heads on the sub-scores, tuned pick; epoch 13 of 20"
started = 2026-10-24
ended = 2026-10-26
start_from = "H04.agent-decoder"
trained = ["planner from scratch (refiner, agent look, 12 scorer heads, map auxiliary targets)", "agent decoder D (detection loss, weight 1)"]
frozen = ["WA-JEPA encoder (tokens cached)"]
