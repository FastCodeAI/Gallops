# H04 -- training the scorer on the sub-scores closes the base's NAVSIM gap (Navvrat, with Siddesh).
# Priority 4 on the 21 Oct list. Its two runs (the agent decoder and the sub-score agent-look model) are mapped here by inference:
# the branch never names the hypothesis, and the sub-score agent-look model changes more than the scorer.
# Sources: this folder's README.md, recipes/drivejepa_wajepa.toml and overlay/{agent_decoder,run3a}.json (numbers
# copied, never re-derived); the gate's printed tables for its verdicts; the item's wording and motivation from the
# team's gap-review page (22 Oct).

schema = 1
id = "H04"
title = "Training the scorer on the sub-scores closes the base's NAVSIM gap"
short = "Sub-score scorer, NAVSIM gap"
track = "hypothesis"
owner = "Navvrat"
contributors = ["Siddesh"]
benchmarks = ["navsim", "bench2drive", "hugsim", "kitscenes", "nuscenes", "neuroncap", "alpasim"]
started = 2026-10-22
status = "running"
verdict = "none"
priority = 4
question = """The 4-camera base trails released Drive-JEPA on navtest (0.820 against 0.845 on Navvrat's \
eval), which fails the gate's NAVSIM bar (0.007). 72% of its failing scenes are a wrong pick with a good plan \
available, and drivable area is about 1.4 points of the gap. The released recipe trains the scorer on the \
final score alone. Does training it on the sub-scores close the gap?"""
hypothesis = """Retraining the base's scorer with NAVSIM's sub-scores switched on, targeting drivable area, \
closes the base's NAVSIM gap to released Drive-JEPA. Refuted if the retrained base still fails the gate's \
NAVSIM pair against released Drive-JEPA: the item decides whether the base passes the gate on NAVSIM."""
predictions = "none: the sub-score agent-look model (called Run 3A while it ran) followed a spec (the user's of 23 Oct, revision 2) that is not committed, the branch has no PREDICTIONS.md, and its mapping to this item is an inference"
learned = """So far, the sub-score agent-look model narrowed the base's navtest gap (EPDMS 85.27 -> 87.30, paired +2.03 [+1.65, \
+2.44]) but stays behind released Drive-JEPA (87.78; paired -0.49 [-0.84, -0.11]); drivable area rose \
.972 -> .984 (released .986). It also added an agent decoder and an agent look in place of the global look, \
so the gain is not the sub-score heads' alone; no scorer-only arm is recorded. The regression gate, run by hand \
from local paddock worktrees, says HOLD on the gate's current subsets: KITScenes and nuScenes GAIN against released Drive-JEPA; NAVSIM, \
Bench2Drive (7 routes, command fix: 40.80 against 59.04), neuroNCAP and AlpaSim NEUTRAL; nothing regressed. Against the 4-camera \
planner every pair is NEUTRAL except Bench2Drive, a REGRESSION (80.24 -> 40.80, t -2.57). On all 220 Bench2Drive routes \
(the command fix, 2 Hz, 21 Nov, in one setup with H18's run) it scores 52.15 against released Drive-JEPA's 40.74 (paired \
+11.40, t 4.87); in that setup the 26 Oct native-50 routes score 56.15, against that run's 63.29 (t -1.66)."""
parents = ["H01"]
narrative = "experiments/H04_subscore_scorer_navsim/README.md"
external = [
  "Paddock's wajepa_dj_run3a adapter: on 27 Oct only uncommitted files in one local paddock worktree (rerank-native), per experiments/H04_subscore_scorer_navsim/README.md; no paddock ref carries it through 5 Nov, so the gate ran from local worktrees (see [[runs.gate]]).",
  "The agent decoder's and the sub-score agent-look model's epoch checkpoints, the lane centrelines and the rear-safe teacher list are off-repo at the training site ({runs}/drivejepa_wajepa/, beside the metric cache); POINTERS.md lists them with bytes and sha256.",
]

[[runs]]
id = "H04.agent-decoder"
label = "the agent decoder that the sub-score agent-look model loads: a sweep of slots x layers; D = 300 slots x 3 layers, epoch 11 of 12 kept"
started = 2026-10-22
ended = 2026-10-23
start_from = "scratch, on H01.four-camera-planner's frozen WA-JEPA token cache"
trained = ["agent decoder (DETR3D-style slots on the token rays)"]
frozen = ["WA-JEPA encoder (tokens cached)"]
train_git_sha = "548bb82"
params_trained_m = 4.25
notes = "† Mapped to H04 by inference: it exists to feed the sub-score agent-look model's agent look. Sweep on the 51 held-out logs (22-23 Oct): 64 x 3, 128 x 3, 64 x 6, 128 x 6, 300 x 3. AdamW 2e-4, weight decay 0.01, batch 64, fp16, cosine over 12 epochs, gradient clip 35. Targets: every vehicle, pedestrian and cyclist within 32 m at time t, nearest 64 kept; navtest never read. D trained 23 Oct 15:56-17:11; its two files are the ones it trained with (verified by timestamps and the code-agent-decoder tree's diff). Checkpoint {runs}/drivejepa_wajepa/agent_decoder/ckpts_D_q300_l3/epoch_11.pt, no sha256 recorded. Trained in a Drive-JEPA checkout at upstream 548bb82 with the overlay, so train_git_sha is that upstream commit. No paddock adapter loads this checkpoint on its own, so `model` names the decoder; it sits at the training site in {data.navsim.exp}/agent_decoder/ckpts_23oct_D_q300_l3/."

