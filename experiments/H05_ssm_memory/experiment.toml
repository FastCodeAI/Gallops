# H05 -- a state-space memory layer makes plans steadier and reactions earlier. Owner Naren.
# Source: "Renesas Progress and Plan", 22 Oct 2026 (Next steps item 5, and "Naren · hypothesis to test"
# with steps 0-4). Step 0 (feature cache, probe, control) ran 3-5 Nov 2026 (Siddesh); its numbers are
# copied from MEMORY_STEP1_LAUNCH.md, MEMORY_STEP2_PROBE.md and MEMORY_STEP2C_CONTROL.md (paddock-sid/memory)
# and from {data}/memory_cache/probe/{probe.json, c/control_c.json, k1/refit_k1.json}. Parked 5 Nov: the
# new design (carry the planner's outputs, not the camera) is H15.

schema = 1
id = "H05"
title = "A state-space memory layer makes plans steadier and reactions earlier"
short = "State-space memory"
track = "hypothesis"
owner = "Naren"
benchmarks = ["navsim", "neuroncap", "bench2drive", "alpasim"]
contributors = ["Siddesh"]
started = 2026-10-21
ended = 2026-11-04
status = "parked"
verdict = "inconclusive"
priority = 5
question = """Does a planner that carries a running state across ticks drive better than one that sees \
only the last 0.5 s? Extended comfort is the base's biggest NAVSIM gap (−0.077); neuroNCAP's side \
crashes are runs that never brake although the car was in view for 2 s or more; Bench2Drive stalls \
after a first stop."""
hypothesis = """Drive-JEPA sees two frames 0.5 s apart and the current ego status; nothing survives \
from one tick to the next. A state-space layer (Mamba-style: a learned recurrence with a fixed-size \
state, linear in sequence length) between the frozen encoder and the planner can carry the scene \
forward: how the crossing car has been moving, a brake already begun, an actor that has left the view. \
Expected: earlier, steadier reactions in closed loop and better NAVSIM extended comfort, with no \
open-loop loss (no size is given). Refuted at step 0 if a probe on the last k ticks stops improving at \
k = 2 (little for memory to add: the layer is not built); at step 2 unless the arm with state carried \
across ticks beats the same layer reset every tick (else the gain is capacity, not memory); at step 3 \
unless it beats that control in closed loop, nothing regresses, and reactions come no later."""
narrative = "experiments/H05_ssm_memory/README.md"
predictions = "none: the step-0 rule was fixed in this record's hypothesis (committed 3 Nov, 4cf7c95) and in the 27 Oct plan, not in a PREDICTIONS.md"
learned = """Against the model's own view (one moment: now and 0.5 s ago), one extra moment improved a ridge \
probe of human speed at +2 s by 0.021 m/s [0.014, 0.028] (4%, events slice, 176 val logs); 0.013 [0.008, 0.019] \
of it is the camera frame from 1 s ago, possibly just the extra 128 numbers. Beyond 1 s only the car state's \
past helped (0.007 m/s); camera history added nothing (CI includes 0). Braking was never better than one \
moment; the rise with longer camera windows is likely overfitting. Limits: 128-number pooled summaries, \
ordinary driving, no crossing-car events; the probe could not see what a trained memory could. The \
registered step-0 refutation ("stops improving at k = 2") was not met by ridge speed, which still improved \
from k = 2 to k = 4 (0.0070 m/s [0.0023, 0.0120]); control (c) puts that gain on the car state's past."""

[[runs]]
id = "H05.r1"
label = "feature cache: released Drive-JEPA's outputs at every moment of navtrain"
started = 2026-11-03
ended = 2026-11-03
start_from = "released"
frozen = ["all of Drive-JEPA: encoder, generator and scorer"]
train_git_sha = "731129f"
notes = """126,694 moments (0 failures, 10.1 h, 4 decode workers on cores 0-3) into \
{data}/memory_cache/release: encoder map (512, 256), scorer input (32, 256), proposals (32, 8, 3), logits \
(32, 6), ego (11), float32, 71 GB. Released checkpoint sha256 740335c8...2d30d05. Ran at d48b35a; rebased \
onto b2d2c59 as 731129f with src/gallops/memory and gallops.compat unchanged (empty diff)."""

  [runs.code]
  modules = ["gallops.memory.ticks", "gallops.memory.inputs", "gallops.memory.cache", "gallops.memory.checks", "gallops.compat"]

  [[runs.data]]
  dataset = "navsim"
  split = "navtrain (vendor log split: 978 train / 214 val logs)"
  role = "eval"
  n = 126694
  unit = "moments"
  note = "every moment with both front images; 91,977 of them are graded tokens (train 76,657 / val 15,320)"

[[runs]]
id = "H05.r2"
label = "step-0 probe (k = 1, 2, 4, 8), control (c) camera past vs car-state past, and the k = 1 refit"
started = 2026-11-04
ended = 2026-11-05
start_from = "H05.r1"
trained = ["ridge and logistic probes, a one-hidden-layer MLP (offline, CPU)"]
