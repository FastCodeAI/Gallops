reproduced all 80 stored values and CIs exactly before computing differences. Pooled encoder map (mean + 4x8) \
-> PCA 128 fitted on train moments, plus ego 11, per moment; windows of k moments along chains. Paired, \
log-clustered bootstrap, 2,000 draws, seed 0. k = 1 is the model's own view (now and 0.5 s ago)."""

