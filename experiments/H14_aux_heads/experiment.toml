# H14 -- auxiliary prediction heads on Drive-JEPA's refiner (Shreedhar). Adjacent to the 21 Oct list, so it
# carries no priority. Nine runs: arms C, T1, T2 x seeds 0-2, recorded one run per arm (the doc reports each
# arm as its seeds' mean with their range); per-seed T - C differences are in the notes.
# Sources: docs/drivejepa-aux-heads.md (+ drivejepa-aux-next.md), recipes/drivejepa_aux.toml and
# src/gallops/drivejepa_aux/ at the head of closed PR #20; its branch, train/drivejepa-auxilliary, is deleted.
# Numbers copied, never re-derived.

schema = 1
id = "H14"
title = "Auxiliary prediction heads on Drive-JEPA's refiner, fine-tuned on nuScenes train"
short = "Aux heads on the refiner"
track = "hypothesis"
owner = "Shreedhar"
benchmarks = ["nuscenes"]
started = 2026-10-20
status = "running"
verdict = "none"
question = """Does training Drive-JEPA's refiner with auxiliary heads (BEV map, objects, lead vehicle, lane \
change; dropped at inference) give better plans than the identical fine-tune without them, and does it cost \
the released model anything it already does well?"""
hypothesis = """H-gain: fine-tuning the planner with auxiliary losses (T) gives better plans than the identical \
fine-tune without them (C). Supported only if the heads learn, T beats C on held-out planning by more than C's \
range across its three seeds and by more than twice the scene-clustered SE of the difference, the sight check \
passes, and (if run) shuffled labels S do not match T. H-safe: T does not regress against the released model \
(R) on any benchmark where R is measured; supported only if the gate's T-vs-R check shows no REGRESSION."""
predictions = "none: the doc cites experiments/drivejepa_aux/PREDICTIONS.md, which was never written; the decision rules the runs are read against are docs/drivejepa-aux-heads.md step 4, committed at 1ec1823 before any run, unchanged"
learned = """So far, open loop and in domain (2,996 keyframes of 102 held-out nuScenes train scenes, epoch 10): \
the heads move the plan the frozen scorer picks, not the proposals. T2's picked L2 at 3 s is 2.934 m against \
C's 3.760 and the release's 3.788, beyond C's seed range and two paired SE on every seed; best of 32 is the \
same in every arm. The lane-change and lane-divider heads learned nothing. Inputs not checked against \
paddock's, no shuffled-label arm, no gate: nothing here speaks to NAVSIM, closed loop or H-safe."""
narrative = "docs/drivejepa-aux-heads.md"
branch = "1c60e59df49114e314b525987561023bb6ad5c7b"
external = [
  "PR #20 was closed unmerged on 28 Oct 2026 and its branch train/drivejepa-auxilliary deleted. The account, recipe and code are at that PR's head, 1c60e59 (refs/pull/20/head), which is where this record links.",
  "Served checkpoints at {weights}/drivejepa_aux/aux-<arm>-s<seed>/step_<n>/ with sidecars, and reports at {runs}/drivejepa_aux/ (report.md, report-epoch10.md, picks-epoch10.md), at the training site (one H200); no sha256 is recorded on the branch.",
  "The next round is proposed, not run: docs/drivejepa-aux-next.md (PREDICTIONS.md first, then the inputs check against paddock, then the gate on T2 seed 0).",
]

[[runs]]
id = "H14.C"
label = "arm C: refiner fine-tune on nuScenes train, no heads (control); seeds 0, 1, 2"
started = 2026-10-21
ended = 2026-10-21
start_from = "released"
trained = ["refiner path"]
frozen = ["encoder", "projector", "scorer"]
params_trained_m = 2.39
train_git_sha = "b48f731"
notes = "Three seeds (recipe stages c-s0, c-s1, c-s2; train runs aux-c-s0..2), 10 epochs of 529 steps at batch 32; planning loss = the Bench2Drive generator stage's mtd_loss with the release's top-2 plans as teachers; Adam 2e-5 on the refiner path. All nine runs passed the preflight identically and trained from b48f731 in a clean worktree. Numbers at the fixed epoch 10; a run's kept epoch was chosen on the held-out scenes it reports on."

  [runs.code]
  recipe = "recipes/drivejepa_aux.toml#c-s0"
  modules = ["gallops.drivejepa_aux"]

  [[runs.data]]
  dataset = "nuscenes"
  split = "train, 577 scenes"
  role = "train"
  n = 16952
  unit = "keyframes"

  [[runs.data]]
  dataset = "nuscenes"
  split = "train, 102 held-out scenes (15%, seed 0)"
  role = "selection"
  n = 2996
  unit = "keyframes"
  scene_list = "recipes/drivejepa_aux/heldout_scenes.json"
  note = "chose each run's kept epoch; the numbers quoted are at epoch 10, which nothing chose"

  [runs.checkpoint]
  model = "drivejepa_aux"
  train_run = "aux-c-s0"
  location = "{weights}/drivejepa_aux/aux-c-s0/"
  sidecar = true

  [[runs.results]]
  bench = "nuscenes"
  metric = "picked-plan L2 at 3 s, m"
  subset = "102 held-out train scenes, every run at epoch 10"
  n = 2996
  unit = "keyframe"
  baseline = "R, the released model"
  baseline_value = "3.788"
  value = "3.760"
  better = "lower"
  strength = "argued"
  flags = ["adapted", "open-loop"]
  note = "mean of three seeds (3.755-3.765); no C-vs-R test reported. Best of 32 ADE 0.197 against R's 0.268, yet C picks the proposal nearest the human on 2.4-2.8% of keyframes against R's 4.7%"
  source = "docs/drivejepa-aux-heads.md, Results (2026-10-21)"

[[runs]]
