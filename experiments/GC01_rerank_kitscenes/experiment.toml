# GC01 -- the KITScenes re-ranker: a small selector over released Drive-JEPA's 32 candidates (Naren).
# Every number below is copied, never re-derived, from: docs/STRATEGY.md ("First target -- taken");
# paddock's docs/models/drivejepa_rerank.md and src/paddock/adapters/models/drivejepa_rerank/model.yaml, both
# copied into paddock/ here; paddock docs/ROADMAP.md and docs/models/comparison.md at a263819; the checkpoint's own checkpoint.json
# (read through `gallops experiments checkpoint`); and, for the nuScenes row, gallops branch
# docs/rerank-nuscenes-result (README) and the same paddock page. The offline neuroNCAP check is on
# paddock branch analysis/drivejepa-ncap-candidates, docs/models/drivejepa-neuroncap.md.

schema = 1
id = "GC01"
title = "A re-ranker over Drive-JEPA's 32 candidates, trained on KITScenes train"
short = "KITScenes re-ranker"
track = "gap-closing"
owner = "Naren"
benchmarks = ["kitscenes", "nuscenes", "neuroncap"]
started = 2026-09-16
ended = 2026-10-12
status = "done"
verdict = "mixed"
question = """Released Drive-JEPA is last on KITScenes (ADE@3s 2.364) and first on NAVSIM. Its 32 candidates \
include one within 0.37 m of the human on average, but its NAVSIM-trained scorer picks one 2.36 m away, about \
15th of 32. Does replacing only the choice -- the model frozen, a small selector trained on KITScenes train -- \
close that gap, and what does it do elsewhere?"""
learned = """Replacing only the choice closes most of the KITScenes gap: ADE@3s 2.521 → 0.973 m against the \
model's own pick on the same path (paired t −8.0; adapted, open loop), and 0.587 cumulative L2 on nuScenes \
zero-shot. It learned closeness to the human path and nothing about collisions: on neuroNCAP 0103 with the \
seeing model it scored 1.85 against 3.01 (9 episodes), and it never picks a stop."""
narrative = "experiments/GC01_rerank_kitscenes/README.md"
external = [
  "experiments/GC01_rerank_kitscenes/paddock/: what ran in paddock, copied from paddock a263819 when paddock stopped holding checkpoints other than the released models (paddock #121 removed it): the adapter (paddock #54, nuScenes #66), the candidate dump and report tools, and the model page with every number, the rebuild steps and the limits.",
  "experiments/GC01_rerank_kitscenes/paddock/results/: the two run records paddock tracked, kitscenes/drivejepa_rerank/20260921T210621-d7ed08 and nuscenes/drivejepa_rerank/20261012T220930-6194bd.",
  "The neuroNCAP 0103 run neuroncap/drivejepa_rerank/20261012T231620-01570a was never tracked; only its numbers are, in the model page.",
  "The input-side checks (acceleration, route command, ego origin, lens distortion) are on paddock branch drivejepa/selection-diagnostics, not merged.",
  "The nuScenes headline is added to this repo's README on the unmerged branch docs/rerank-nuscenes-result.",
]

[[runs]]
id = "GC01.kitscenes-train-h128-t1"
label = "the selector: 128 hidden units, label temperature 1.0, epoch 325 of 400"
start_from = "released"
trained = ["selector (new one-hidden-layer MLP over 18 features per candidate)"]
frozen = ["all of Drive-JEPA: encoder, generator and scorer"]
params_trained_m = 0.002561
train_git_sha = "dfa7459"
notes = """Listwise cross-entropy against softmax(−ADE) over the 32, full batch, Adam, numpy. Hidden size and \
temperature won a sweep over {16, 32, 64, 128} × {0.3, 0.5, 1.0} ranked on held-out train scenes only; the \
sweep also computed the benchmark score of every configuration and the held-out winner was the benchmark's \
best too, so the paddock page says the benchmark 'was not unseen'. Candidates were dumped through paddock's \
own KITScenes harness (tools/models/drivejepa/paddock_candidates.py, now copied in paddock/ here; \
DRIVEJEPA_IMAGE_GEOMETRY=openscene); \
that step is paddock's, the data and training steps are gallops'."""

  [runs.code]
  entry = "gallops.train.rerank"
  modules = ["gallops.data.rerank"]
  as_run = ["experiments/GC01_rerank_kitscenes/paddock/"]

  [[runs.data]]
  dataset = "kitscenes"
  split = "train"
  role = "train"
  n = 4858
  unit = "keyframes"
  scene_list = "src/gallops/data/rerank_train_scenes.txt"
  built_by = "gallops.data.rerank"
  manifest_sha256 = "12e5535e7417548f680a004efd8111c21b08e4a3ae2a963b0fef9c6b8e37d093"
  note = "318 of the list's 373 scenes (the first 373 of 533 to download, revision 213352cf); 5,711 keyframes in all. The sha256 is the train.npz export's (checkpoint.json notes.dataset_sha256)"

  [[runs.data]]
  dataset = "kitscenes"
  split = "train, 55 held-out scenes (seed 0)"
  role = "selection"
  n = 853
  unit = "keyframes"
  scene_list = "src/gallops/data/rerank_train_scenes.txt"
  note = "chose the epoch by the pick's ADE; the 55 scene ids are in checkpoint.json notes.holdout_scenes"

  [[runs.data]]
  dataset = "kitscenes"
  split = "val + overlap_train_val"
  role = "eval"
  n = 223
  unit = "samples"
  note = "140 scenes, none among the 373 (checked by scene id)"

  [[runs.data]]
  dataset = "nuscenes"
  split = "val"
  role = "eval"
  n = 5119
  unit = "samples"
  note = "150 scenes; no nuScenes data went into the selector"

  [[runs.data]]
  dataset = "neuroncap"
  split = "scene 0103, three scenario pairs, seeds 0-2"
  role = "eval"
  n = 9
  unit = "episodes"

  [runs.checkpoint]
  model = "drivejepa_rerank"
  train_run = "kitscenes-train-h128-t1"
  step = 325
  step_unit = "epoch"
  weights_sha256 = "2050b799e8e88d4fdd46d95233bacf71a97eabf7db975fbf1de17052d66b91fa"
  file = "reranker.npz"
  location = "{weights}/drivejepa_rerank/kitscenes-train-h128-t1/step_000000325/"
  sidecar = true
  shipped_as = "paddock model drivejepa_rerank, until paddock #121 removed it; its model.yaml, which pins this directory, is in paddock/ here"

  [[runs.results]]
  bench = "kitscenes"
  metric = "ADE@3s (m)"
  subset = "all 223 benchmark samples"
  n = 223
  unit = "sample"
  baseline = "Drive-JEPA's own pick, same path and inputs"
  baseline_value = "2.521"
  value = "0.973"
  se = "0.174"
  t = "-8.0"
  better = "lower"
  strength = "strong"
  flags = ["adapted", "open-loop"]
  headline = true
  note = "paired −1.548 m with scene-clustered SE over 140 scenes; best of the 32 (any selector's ceiling) 0.409; the recorded drivejepa row (devkit loader) 2.364; FDE@3s 2.082; better than the model's pick on 155 samples, worse on 46"
  source = "experiments/GC01_rerank_kitscenes/paddock/docs/models/drivejepa_rerank.md, run 20260921T210621-d7ed08"

  [[runs.results]]
  bench = "kitscenes"
  metric = "ADE@3s (m)"
  subset = "all 223 benchmark samples"
  n = 223
  unit = "sample"
  baseline = "the candidate closest to constant velocity"
  baseline_value = "1.159"
  value = "0.973"
  se = "0.050"
  t = "-4.9"
  better = "lower"
  strength = "moderate"
  flags = ["adapted", "open-loop"]
  note = "paired −0.186 m: it is not just picking 'keep your speed'"
  source = "experiments/GC01_rerank_kitscenes/paddock/docs/models/drivejepa_rerank.md, run 20260921T210621-d7ed08"

  [[runs.results]]
  bench = "kitscenes"
  metric = "pick ADE@3s on the held-out train scenes (m)"
  subset = "55 held-out train scenes, the epoch-selection split"
  n = 853
  unit = "keyframe"
  baseline = "Drive-JEPA's own pick"
  baseline_value = "2.515"
  value = "1.050"
  better = "lower"
  strength = "moderate"
  flags = ["adapted", "open-loop", "selected-on-report"]
  note = "best of the 32 here 0.502; this is the split the epoch was chosen on"
  source = "experiments/GC01_rerank_kitscenes/paddock/docs/models/drivejepa_rerank.md; checkpoint.json notes.holdout_pick_ade"

  [[runs.results]]
  bench = "nuscenes"
  metric = "cumulative L2 (m)"
  subset = "val, all 5,119 samples over 150 scenes, camera-frame fix"
  n = 5119
  unit = "sample"
  baseline = "constant velocity"
  baseline_value = "0.641"
  value = "0.587"
  t = "-2.8"
  better = "lower"
  strength = "moderate"
  flags = ["open-loop"]
  note = "zero-shot; paired −0.054 m with SEs over the 150 scenes; ADE@3s 0.949 against 1.069 (t −3.4); point collisions 1.21% against 1.66%, not separated (t −1.5)"
  source = "experiments/GC01_rerank_kitscenes/paddock/docs/models/drivejepa_rerank.md, run 20261012T220930-6194bd"

  [[runs.results]]
  bench = "nuscenes"
  metric = "cumulative L2 (m)"
  subset = "val, all 5,119 samples over 150 scenes, camera-frame fix"
  n = 5119
  unit = "sample"
  baseline = "drivejepa with the fix, native cameras (run 20261012T215049-798a0d, not tracked)"
  baseline_value = "1.360"
  value = "0.587"
  t = "-16"
  better = "lower"
  strength = "moderate"
  flags = ["open-loop"]
  note = "paired −0.772 m, but it mixes two changes: this model runs on the OpenScene crop, drivejepa on native cameras. The selector's own effect at the same pixels is unmeasured on nuScenes"
  source = "experiments/GC01_rerank_kitscenes/paddock/docs/models/drivejepa_rerank.md; gallops branch docs/rerank-nuscenes-result"

  [[runs.results]]
  bench = "neuroncap"
  metric = "ncap_score"
  subset = "scene 0103, three scenario pairs, seeds 0-2, seeing model (camera-frame fix)"
  n = 9
  unit = "episode"
  baseline = "drivejepa on the same nine episodes (20261012T205915-7153f0)"
  baseline_value = "3.01"
  value = "1.85"
  better = "higher"
  strength = "moderate"
  flags = ["smoke", "no-record"]
  note = "hit in 6 of 9 against 5; a subset, not a neuroNCAP score. The re-ranker's run 20261012T231620-01570a is not tracked"
  source = "experiments/GC01_rerank_kitscenes/paddock/docs/models/drivejepa_rerank.md (Limits); paddock docs/ROADMAP.md at a263819"

[[checks]]
name = "Input-side explanations before the selector"
date = 2026-09-19
result = "none moved the pick beyond noise: acceleration zeroed or smoothed ≤ 0.07 m (t ≤ 1.75), route command ≤ 0.07 m (t ≤ 1.75), ego origin at the rear axle −0.09 to +0.02 m (t ≤ 0.7), OpenScene lens distortion −0.14 m (t −1.27); best of 32 stayed 0.35–0.39 m and the pick's mean rank 14.6–15.3"
decided = "the deficit is the scorer's choice, so the first target became a re-ranker, not a speed head"
source = "experiments/GC01_rerank_kitscenes/paddock/docs/models/drivejepa_rerank.md ('Why the choice'); docs/STRATEGY.md"

[[checks]]
name = "Rebuild from gallops' data steps"
result = "`gallops.data.rerank keyframes` lists the same 5,711 keyframes the checkpoint trained on; `dataset` on the original dump gives every array of the original train.npz unchanged (its sha256 is checkpoint.json's dataset_sha256); a 5-sample smoke matched the paddock run to the dump's 4-decimal rounding"
decided = "the data steps moved from paddock into gallops (gallops.data.rerank)"
source = "experiments/GC01_rerank_kitscenes/paddock/docs/models/drivejepa_rerank.md"

[[checks]]
name = "The re-ranker as the picker on neuroNCAP candidate dumps (camera-blind)"
date = 2026-09-23
result = "picked a clear plan on 0 of the 322 ticks where the driven plan hits although one of the 32 was clear; it never picks a stop"
decided = "not quoted on the model page, because the dumps were camera-blind; the model stays open-loop only until a full neuroNCAP run pairs it with drivejepa"
source = "paddock branch analysis/drivejepa-ncap-candidates, docs/models/drivejepa-neuroncap.md; experiments/GC01_rerank_kitscenes/paddock/docs/models/drivejepa_rerank.md"
