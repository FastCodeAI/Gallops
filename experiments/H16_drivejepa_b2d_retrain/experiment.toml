params_trained_m = 6.29
notes = "Sid's KIT Experiment 1 recipe (H07.exp1): masks 8 x 0.15 and 2 x 0.70, the same patches in both frames; guesser = the predictor from vitl_merge_3dataset_e50.pt with his grid fix; slow copy EMA 0.99925 of the LoRA, main phase only; L1 to the layer-normed target at hidden tokens. AdamW, LoRA lr 2e-4 wd 0, guesser lr 1e-4 wd 0.04, a 200-step ramp in each phase, batch 32, bf16, seed 20261016. 1,000 guesser-only steps, then 3 passes of 1,350 steps (5,050 in all), 05 Nov 16:05-17:25, beside run 3A-M on the same GPU. No stop rule: all 3 passes run. Pass 3 taken for its lowest held-out loss, from Navvrat's 'looks good can we start it' after the vocabulary report; neither pass nor size was named outright, so it is to confirm. Merged with Sid's merge(), unchanged, lifted from f_final.py with ast. The code was not committed when it trained, so train_git_sha is the Drive-JEPA tree's upstream commit; that tree has local changes (POINTERS.md). The trainer that ran is scripts/phase1/train_b2d_with_ade_as_run.py: it also computed the released planner's ADE each pass (tables/p1_05nov_reports.csv), which spec v3 dropped while the run was on pass 3. The merged encoder sits at the training site in {runs}/b2d_drivejepa/phase1/merged/p1_05nov_pass_03/."

