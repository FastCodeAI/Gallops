# H16 -- Drive-JEPA's training rebuilt on Bench2Drive (Navvrat).
# Registered after the runs, from the specs and reports of 5-6 Nov: nothing here was registered first, and the
# hypothesis' wording is the recorder's, read from the specs, for Navvrat to confirm.
# Its own ID by the rule in docs/experiments.md#runs: H07's verdict turns on AlpaSim and on WA-JEPA's encoder, which
# nothing here touches, and GC04 is phase 1, closed. H12 and H13 are retired and H15 is taken on open branches.
# Sources: this folder's specs/, reports/ and tables/ (copied, machine roots replaced by placeholders); the gate's own
# verdict files for [[runs.gate]]. Numbers are copied, never re-derived. POINTERS.md holds what is off the repository.

schema = 1
id = "H16"
title = "Drive-JEPA's training rebuilt on Bench2Drive: encoder LoRA, own vocabulary, own grade, Stage 2"
short = "Drive-JEPA rebuilt on Bench2Drive"
track = "hypothesis"
owner = "Navvrat"
benchmarks = ["bench2drive", "kitscenes", "nuscenes", "neuroncap", "navsim", "alpasim", "offline"]
started = 2026-11-05
status = "running"
verdict = "none"
question = """Released Drive-JEPA was trained on NAVSIM and drives paddock's 50 Bench2Drive routes to a mean DS of \
57.60 at 2 Hz; GC04's Final reached 73.6 by retraining parts of it, with the encoder frozen and same-spot twins of \
eval routes in its training set. If everything Drive-JEPA's training rests on is rebuilt from Bench2Drive instead \
(the encoder adapted by hide-and-guess, a vocabulary from the expert's paths, a grade from Bench2Drive's own penalties, \
Stage 2 on those), with the eval routes and their trigger twins kept out, what does the model do, on the routes and on \
the regression gate?"""
hypothesis = """Rebuilding Drive-JEPA's training on Bench2Drive's own data and scoring terms gives a model that drives \
the 50 routes better than the released model, whose DS there is 57.60 at 2 Hz. No effect size or refutation rule was \
written before the runs: this wording is read from the specs, not taken from them."""
predictions = "none: the specs of 5 Nov fix the recipe and what to report, not an expected effect, and nothing was registered here before the runs, though the rule already stood"
learned = """So far, and none of it a Bench2Drive driving score. Offline on the 47 held-out clips, epoch 18's pick grades \
.894 on the 4 s grade, against .983 for the expert and .981 for the best of its 32 (closest ADE .240 m, pick ADE \
2.23 m). On the 13 of 50 routes that finished before the run was stopped, its mean DS is 31.73, against 42.16 for the \
released model and 45.36 for Run 3A on the same routes; those 13 are the front of the queue, not a sample of the 50. \
The regression gate, run by hand, says FAIL: KITScenes 2.537 -> 3.159, nuScenes 2.431 -> 3.796 and neuroNCAP \
3.679 -> 1.820 regress, with the candidate on crop native and FOLLOW sent as straight; NAVSIM, AlpaSim and the gate's \
Bench2Drive subset have no result yet."""
parents = ["H07", "GC04"]
narrative = "experiments/H16_drivejepa_b2d_retrain/README.md"
external = [
  "Paddock's drivejepa_p2 adapter: uncommitted, in local paddock worktrees rerank-native (the 50 routes) and gate-oct27 (the gate), so the gate ran from those worktrees and not from the queue. Its two files are in this folder's paddock/, machine roots replaced by placeholders.",
  "Merged encoder, epoch checkpoints, the frame cache, grade files and teacher index: off-repo at the training site; POINTERS.md lists each with bytes and sha256 where it is small enough to hash.",
  "Site tooling the as-run scripts import, which is in no repository of ours: paddock-ops mtd/, b2d-labels/ and phase0a-labels/; run3a-adapted is a local git repository. POINTERS.md pins each file by sha256. mtd/scorer.py is in src/ as scorer.py, unchanged.",
  "Closed-loop run records and the gate's manifests and per-subset logs: {runs}/b2d_drivejepa/phase2/. The small tables this record's numbers come from are in tables/.",
]

