name: drivejepa_p2
description: Drive-JEPA trained on Bench2Drive (Phase 2) - LoRA-merged encoder, generator and scorer from scratch, Step A v2 grade, epoch 18
repo: Drive-JEPA

# Ops adapter (06 Nov 2026), not for a PR as it stands: absolute paths. Tree and venv = the ones it was trained in.
runtime:
  kind: uv
  python: "3.9"
  venv: "{drivejepa_env}/.venv"
  pythonpath: ["{code.drivejepa}/navsim_v2"]
  # Load-bearing: the agent does np.load("./data/8192.npy") relative to cwd.
  cwd: "{code.drivejepa}/navsim_v2"
  env:
    NAVSIM_DEVKIT_ROOT: "{code.drivejepa}/navsim_v2"
    NAVSIM_EXP_ROOT: "{data.navsim.exp}"
    NUPLAN_MAP_VERSION: "nuplan-maps-v1.0"
    DRIVEJEPA_CHECKPOINT: "{runs}/b2d_drivejepa/phase2/runs/p2_05nov/ckpt_epoch18/agent.ckpt"
    DRIVEJEPA_IMAGE_GEOMETRY: "native"
    DRIVE_JEPA_MSDA: "pytorch"
    CUDA_HOME: "{conda}/envs/unidrivevla"
    OMP_NUM_THREADS: "2"

capabilities:
  cameras: [CAM_FRONT, CAM_FRONT_LEFT, CAM_FRONT_RIGHT, CAM_BACK]
  vram_gb: 5
  startup_timeout_s: 900
  waypoint_dt: 0.5
  min_input_hz: 2.0
  native_input_hz: 2.0
  planning_hz: 2.0
  history_s: 1.5
  architecture: "V-JEPA 2 ViT-L/16 with a Bench2Drive LoRA merged in, Drive-JEPA proposal generator and scorer"
  input_size: [512, 256]
  history_frames: 2
  output_kind: waypoints
  horizon_s: 4.0
  trained_on:
    - dataset: bench2drive
      split: Base, 897 clips (LoRA run's training list)
benchmarks: [navsim, bench2drive, nuscenes, kitscenes, neuroncap, alpasim]
