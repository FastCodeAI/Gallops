[[checks]]
name = "Expert v6, Gate B: v6 drives all 150 training episodes (trigger T = 3.5 s)"
result = "no contact frontal 42/50, stationary 50/50, side 23/50, against 4/50, 46/50, 25/50 for the released seeing model; 0 off-road ticks, 0 side flips; with memory cleared the same decision on 98.3% / 100% / 97.3% of ticks. Frontal failures are all 0058 (road too narrow to pass; v6 brakes, 1.56); most side failures are a crossing car at a 36–45° bearing, outside the front camera's 32.6°"
decided = "side is left as it is; v6 approved as the teacher (13 Oct, per the team's status page)"
source = "docs/brake-swerve-expert.md §2 (branch expert/v6-imitation)"

[[checks]]
