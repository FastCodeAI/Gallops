[[checks]]
name = "Expert v6, Gate A: replay"
result = "each round-0 episode's driven plans, replayed through neuro-ncap's own Engine.step, vehicle model, evaluator and collision checker without the renderer (expert/rollout.py), reproduce its ego_poses.json and metrics.json: 150/150 episodes, worst 0.07 mm, metrics exact"
