# GC08 -- expert v6 (brake; brake then swerve for oncoming cars) and the imitation rounds 1A, 1B and 2 (Naren).
# On branch expert/v6-imitation: every number is copied from sections 2-5 and the conclusion of
# docs/brake-swerve-expert.md there. Checkpoint blocks from `gallops experiments checkpoint` on each step
# directory; run dates from each run's metrics.jsonl (UTC). The paddock run dirs in `external` were matched to
# their checkpoint by the digest paddock writes in place of the DRIVEJEPA_CHECKPOINT path.

schema = 1
id = "GC08"
title = "Expert v6 (brake, then swerve for oncoming cars) and its imitation rounds 1A, 1B and 2"
short = "Expert v6 imitation"
track = "gap-closing"
owner = "Naren"
benchmarks = ["neuroncap", "nuscenes"]
started = 2026-10-13
ended = 2026-10-16
status = "done"
verdict = "negative"
question = """On neuroNCAP the seeing model should brake for a parked and a crossing car, and for an oncoming \
car brake first, then steer round it. Can it learn that by imitating one consistent expert (v6), proven in an \
offline copy of the simulator, from the 5 reconstructed training scenes, and does what it learns transfer to \
a street it has not seen?"""
learned = """Imitating v6 teaches brake-then-swerve on the scenes it trained on (round 1B on new seeds: frontal \
clear in 10 of 20 runs, against 4 of 50 released), but it did not transfer: round 1A on held-out 0075 learned \
to brake for the side car and not to swerve, and on 0103 round 2 scored 2.31 against 3.01, all on 3-10 runs a \
shape. The likely cause, argued and not tested, is too few scenes (5, from 2 cities; NeuRAD measured 7.5 h \
per new scene on this machine)."""
narrative = "docs/brake-swerve-expert.md"
branch = "expert/v6-imitation"
parents = ["GC07"]
external = [
  "neuroNCAP runs on 0103 (3 per shape), paddock run dirs under the site's paddock runs root, committed to no repository: neuroncap/drivejepa/20261014T153543-0d6a7b (1A epoch 1), 20261015T055256-49c277 (1B epoch 2), 20261016T180740-bf1796 (round 2); and 20261012T205915-7153f0, the released seeing model on seeds 0-2, whose scores match the doc's baseline (the doc names no run).",
  "nuScenes open loop of 1B epoch 2: paddock run dir nuscenes/drivejepa/20261015T074632-198187, committed to no repository.",
  "Round 1A on 0075 (10 runs per shape): the gallops collection collect_r1a_eval under {runs}; which 1A epoch drove it is not recorded.",
  "Labelled data (labelled_r0cam_v6, labelled_expert_v6, labelled_r2_v6, labelled_nusc) and candidate dumps: under {runs}, listed per run in each sidecar's notes.sources.",
]

[[runs]]
id = "GC08.v6-r1a-loso0075"
label = "round 1A: refiner and scorer imitate v6 on 4 scenes, 0075 held out"
started = 2026-10-14
ended = 2026-10-14
start_from = "released Drive-JEPA (seeing)"
trained = ["refiner", "scorer"]
frozen = ["encoder"]
train_git_sha = "21067a5"
notes = "The checkpoint is pinned by agent.ckpt, the file paddock loads (model.pt is a member). That agent.ckpt was written 15 Oct 03:53 IST, after the 0103 run 0d6a7b that loaded it (14 Oct 21:05 IST). It holds the same tensors as model.pt (495 tensors, 318,206,188 elements, none differing; checked 4 Nov), and model.pt predates that run. Re-running the export does not reproduce its bytes (#26 review), so which bytes the run read is still not shown. Winner-takes-all L1 to the v6 plan plus scorer BCE and ranking; batch 1 × 8 accumulated, lr 1e-4, brake ticks 2×, brake-then-swerve 4×, 3 epochs. Training curves: nearest-candidate distance to the v6 plan 1.18 → 0.48 m (train), 0.83 → ~0.59 m (held-out 0075); scorer picks the best of 32 on 27–31% of training ticks, 9–22% on 0075, where its loss does not fall. Pinned checkpoint is epoch 1 (the one driven on 0103); epochs 2 and 3 are step_000031485 (ed263d39acfb) and step_000047338 (b1c829eb3dec). The sidecar's step counts one-tick forward passes, not optimizer steps (train/swerve.py increments it per micro-batch)."

  [runs.code]
  entry = "gallops.train.swerve"
  modules = [
    "gallops.train.swerve_data",
    "gallops.train.preflight",
    "gallops.train.frame_cache",
    "gallops.train.losses",
    "gallops.expert.teacher",
    "gallops.expert.label",
    "gallops.expert.grader",
    "gallops.expert.lanes",
    "gallops.expert.draw",
    "gallops.expert.drivable",
  ]

  [[runs.data]]
  dataset = "neuroncap-actor-insertion"
  split = "round 0, 4 of the 5 rendered training scenes (0075 held out)"
  role = "train"
  built_by = "gallops.expert.label"
  note = "driven by the released seeing model, relabelled by v6; the doc gives 8,402 ticks over 150 episodes for round 0, of which 0075's are held out"

  [[runs.data]]
  dataset = "nuscenes"
  split = "train, real driving (human source)"
  role = "train"
  note = "33% kept each epoch; the target is the human's path"

  [[runs.data]]
  dataset = "neuroncap-actor-insertion"
  split = "scene 0075"
  role = "held-out"
  note = "training curves, and 10 closed-loop runs per shape"

  [[runs.data]]
  dataset = "neuroncap"
  split = "scene 0103, frontal / stationary / side"
  role = "eval"
  n = 9
  unit = "runs"

  [runs.checkpoint]
  model = "drivejepa_swerve"
  train_run = "v6-r1a-loso0075"
  step = 15684
  weights_sha256 = "cd4fc891749717b707ec4847b27370dcd27e57ce348ebeecbb4698abc92f9ca5"
  file = "agent.ckpt"
  members = [
    "cd4fc891749717b707ec4847b27370dcd27e57ce348ebeecbb4698abc92f9ca5  agent.ckpt",
    "49bf193783003cb8487eb6cc29856556fa07b4b80c7c6d182cc022b22e51b838  model.pt",
  ]
  location = "{weights}/drivejepa_swerve/v6-r1a-loso0075/step_000015684/"
  sidecar = true
  known_wrong = "train_git_sha records 048d49c, the commit at save time; 1A ran 21067a5. trained_on names only the rendered round-0 collection (it also read real nuScenes; notes.sources lists it). --accumulate and --subsample-source are not recorded"

  [[runs.results]]
  bench = "neuroncap"
  metric = "ncap_score, side"
  subset = "scene 0075 (held out of 1A), 10 runs"
  n = 10
  unit = "run"
  baseline = "released Drive-JEPA, seeing"
  baseline_value = "0.00"
  value = "5.00"
  better = "higher"
  strength = "moderate"
  flags = ["smoke", "adapted", "no-record"]
  note = "10/10 clear against 0/10; it brakes for the side car. Checkpoint epoch not recorded"
  source = "docs/brake-swerve-expert.md §4 (branch)"

  [[runs.results]]
  bench = "neuroncap"
  metric = "ncap_score, frontal"
  subset = "scene 0075 (held out of 1A), 10 runs"
  n = 10
  unit = "run"
  baseline = "released Drive-JEPA, seeing"
  baseline_value = "1.84"
  value = "1.69"
  better = "higher"
  strength = "moderate"
  flags = ["smoke", "adapted", "no-record"]
  note = "0/10 clear either way: no swerve learned on the unseen street; stationary 5.00 for both"
  source = "docs/brake-swerve-expert.md §4 (branch)"

  [[runs.results]]
  bench = "neuroncap"
  metric = "ncap_score, frontal"
  subset = "scene 0103, 3 runs, epoch 1"
  n = 3
  unit = "run"
  baseline = "released Drive-JEPA, seeing"
  baseline_value = "2.36"
  value = "2.01"
  better = "higher"
  strength = "moderate"
  flags = ["smoke", "adapted", "no-record"]
  note = "3/3 hit either way; side 0.00 (3/3 hit) against 1.67 (2/3 hit); stationary 5.00 for both"
  source = "docs/brake-swerve-expert.md §4 (branch); paddock run neuroncap/drivejepa/20261014T153543-0d6a7b"

