# H07 -- a LoRA on the encoder closes the domain gap (Siddesh). Priority 7 on the 21 Oct list.
# exp1 is the encoder LoRA the item names; exp2a, exp2b and exp3 are adjacent runs on the same branch,
# mapped here by inference (they train the generator and scorer as well).
# Sources: README.md and the step folders here (step reports, 11_regression_gate/
# RESULTS.md and results.json); sha256s from POINTERS.md. Numbers are
# copied, never re-derived. Page-only facts from the team's gap-review page (22 Oct) are flagged no-record.

schema = 1
id = "H07"
title = "A LoRA on the encoder closes the domain gap: the KITScenes gain holds in closed loop and on the base's encoder"
short = "Encoder LoRA, domain gap"
track = "hypothesis"
owner = "Siddesh"
benchmarks = ["kitscenes", "alpasim"]
started = 2026-10-16
status = "running"
verdict = "none"
priority = 7
question = """Released Drive-JEPA, trained on NAVSIM, picks poorly on KITScenes: pick ADE (3 s) 2.372 m on \
223 held-out moments while its closest candidate is 0.374 m away. A rank-16 LoRA on its encoder, trained by \
V-JEPA 2's hide-and-guess task on KITScenes frames with no human paths, moved the pick. Does that gain hold \
in closed loop (AlpaSim) and on the base's WA-JEPA encoder, i.e. does adapting the encoder transfer?"""
hypothesis = """A LoRA on the encoder, trained self-supervised on the target domain's frames, closes the \
domain gap: the KITScenes gain (2.37 -> 1.88 m, open loop) holds in closed loop (AlpaSim, 30 scenes) and \
when repeated on the base's WA-JEPA encoder. Refuted if the merged-LoRA encoder gives no closed-loop gain \
over the released model on AlpaSim, or a LoRA on WA-JEPA's encoder does not reproduce the KITScenes gain."""
predictions = "none: the encoder LoRA (exp1) trained 16 Oct, before the 21 Oct hypothesis list; the branch has no PREDICTIONS.md"
learned = """So far, open loop on 223 held-out KITScenes moments, the LoRA alone moved the pick (ADE \
2.372 -> 1.879 m) with the menu unchanged (closest candidate 0.374 -> 0.378 m); training the generator and \
then the scorer took the pick to 0.596 m. The only closed-loop test is of exp3, which also retrained the \
generator and scorer: the gate FAILs it (AlpaSim 0.4344 -> 0.1158, Bench2Drive 59.0360 -> 0.2686, NAVSIM \
0.8572 -> 0.7533). The hypothesis' own tests, the LoRA alone in AlpaSim and a LoRA on WA-JEPA, have not run."""
narrative = "experiments/H07_encoder_lora/README.md"
external = [
  "Weights, frame caches and per-moment results: off-repo at the training site, each with bytes and sha256 in experiments/H07_encoder_lora/POINTERS.md. None has a checkpoint.json sidecar or sits in {weights}.",
  "Gate job 20261027T215457-siddesh-94f0 in paddock's queue site folder (verdict.json, gate.log, baseline.toml, smoke/manifest.toml); candidate runs under paddock's runs root, <bench>/drivejepa/<run>.",
  "The vendored Drive-JEPA tree (upstream e21f474) every experiment imports has local changes in no git history: two modified attention files and three untracked files, the KITScenes adapter among them; sha256 in POINTERS.md.",
  "Siddesh's page 'Drive-JEPA Encoder LoRA on KIT', quoted on the team's 22 Oct page: 96 moments better, 55 worse, 72 within 10 cm; 1.4 GPU-hours (no-record).",
]

