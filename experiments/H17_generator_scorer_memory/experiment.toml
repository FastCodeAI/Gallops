[[runs]]
id = "H17.r2"
label = "first training run: memory carried against memory wiped, two passes, one seed"
started = 2026-11-09
ended = 2026-11-10
start_from = "3d566eb211b5"
trained = ["generator", "scorer", "memory blocks (new, 1.67 M parameters)"]
frozen = ["encoder (its output is read from the cache)"]
notes = """Two arms from the same start, same batch order: the memory carried from moment to moment, and the \
same layer wiped at every moment. The chosen check of each arm is the best pick grade among its ten checks on \
the picking set, which is also the set reported on. The checkpoint pinned here is the carried arm's; the wiped \
arm's is in POINTERS.md. The memory collapsed in this run (see the first check above)."""

  [runs.code]
  as_run = [
    "experiments/H17_generator_scorer_memory/03_memory_model_and_trainer/",
    "experiments/H17_generator_scorer_memory/04_carried_vs_wiped_training_run/",
  ]

  [[runs.data]]
  dataset = "physicalai_av"
  split = "training slice of the earlier retrain"
  role = "train"
  n = 126981
  unit = "moments"

  [[runs.data]]
  dataset = "physicalai_av"
  split = "picking set, graded moments"
  role = "selection"
  n = 1131
  unit = "moments"

  [runs.checkpoint]
  model = "drivejepa_physicalai_memory"
  train_run = "h17-r2-carried"
  step = 5218
  step_unit = "optimizer_step"
  weights_sha256 = "70b37896e5b1369a093195cfa4c46b62749200fdb29b6712e0f24d5ba604a5cd"
  file = "p01.2.pt"
  location = "{weights}/drivejepa_physicalai_memory/h17-r2-carried/step_000005218/"
  sidecar = false

  [[runs.results]]
  bench = "offline"
  metric = "mean grade of the picked path, first training run: memory carried vs wiped"
  baseline = "the same model trained with its memory wiped at every moment"
  baseline_value = "0.7639"
  value = "0.7752"
  n = 1131
  unit = "moment"
  better = "higher"
  strength = "moderate"
  flags = ["open-loop", "selected-on-report"]
  source = "experiments/H17_generator_scorer_memory/04_carried_vs_wiped_training_run/tables/pilot_final.json: comparison.overall"
  note = """Memory collapsed in this run (slots 99.96 % alike), so the gap is not the memory working. Gap \
+0.0113, 95 % interval -0.0076 to +0.0315 (46 clips resampled, 2,000 draws): it crosses zero. The starting model \
scores 0.7685 on the same moments. On the 34 moments after an event the carried arm is lower, 0.9574 against \
0.9674, so the rule written beforehand said stop. One seed."""

