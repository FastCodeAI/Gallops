# H17 -- a memory that the generator and the scorer both read, trained with them on Physical AI AV. Owner Siddesh.
# Sources: every number is copied from a json file in this folder's step folders (named in each `source`), or
# from a run file listed in POINTERS.md. The step reports quote the same files.
# The rules for every field are in docs/experiments.md; src/gallops/experiments.py validates them.

schema = 1
id = "H17"
title = "A memory read by both the generator and the scorer, trained with them, picks better paths"
short = "Generator and scorer memory"
track = "hypothesis"
owner = "Siddesh"
benchmarks = ["offline"]
started = 2026-11-07
ended = 2026-11-12
status = "parked"
verdict = "negative"
question = """H05 found that the camera's past, read through a small probe, adds little; H15 carried only the \
planner's own outputs and could not be told from the same layer wiped. Both left the released model frozen. \
Does a memory help when the two parts that decide the drive, the generator that proposes 32 paths and the \
scorer that picks one, are trained to use it?"""
hypothesis = """A memory of 16 slots, written at every moment from the frozen encoder's output and read by \
both the generator and the scorer, trained together with them from Drive-JEPA 0.1.8b on Physical AI AV, makes \
the scorer pick better paths than the same model with the memory wiped at every moment. Expected: a higher \
mean grade of the picked path on the picking set, and at least +0.01 on moments within 5 s after a cut-in, a \
crossing or a hard brake. Refuted if the carried memory does not beat the wiped one."""
predictions = "none: the rule for each run was written before it started (file times and run logs agree) but in a folder outside git, so no commit date shows it"
learned = """Camera memory has a low ceiling on this data. With a healthy memory (slots distinct, gates open, \
earlier views recalled), carrying it gave a pick grade of 0.7313 against 0.7355 with the same weights and the \
memory reset every moment, on 1,131 graded moments: no gain. The first training run's gap in favour of the \
carried memory (0.7752 against 0.7639, 95 % interval -0.008 to +0.032) came from a collapsed memory whose 16 \
slots were 99.96 % alike, so it is not the memory working. A direct test found the trained memory adds nothing \
for predicting the driver beyond the current view and the car's own motion history. Given the true past camera \
view directly, a linear reader gains 1 to 2 % on speed and nothing on braking or steering. The car's own \
motion history is the stronger signal, and is a separate, later experiment. Limits: one seed, one data set, \
open loop only; the 12-scene closed-loop check of carried against reset had not finished when this was recorded."""
parents = ["H05", "H15"]
narrative = "experiments/H17_generator_scorer_memory/README.md"

[[checks]]
name = "Was the memory in the first training run working?"
result = "No. At the carried arm's chosen check the 16 slots were 99.96 % alike (mean pairwise cosine 0.9996) and the gates were almost shut (mean 0.006 per slot)."
date = 2026-11-10
decided = "fix the memory before reading anything from the gap between the arms (H17.r3, H17.r4)"
source = "experiments/H17_generator_scorer_memory/04_carried_vs_wiped_training_run/REPORT.md"

[[checks]]
name = "Does the trained memory hold information that matters for driving?"
result = "No, by the rule written beforehand. Adding the carried memory predicts the driver's next 3 s no better than adding the wiped memory on any of six targets; both controls pass. On top of the current view and the car's own history it adds -2.8 % to +0.6 %."
date = 2026-11-12
decided = "ask whether the true past camera view helps at all"
source = "experiments/H17_generator_scorer_memory/07_does_the_memory_hold_driving_information/REPORT.md"

[[checks]]
name = "Does the true past camera view help predict the driver?"
result = "Unclear, by the rule written beforehand. Views from 2 s and 4 s ago add at most 1.2 to 1.3 % on speed at +3 s (bar 2 %) and 1.7 % on event moments (bar 5 %); the linear reader's gains on speed exclude zero; nothing on braking or steering."
date = 2026-11-12
decided = "park the camera memory; the car's own motion history is a separate experiment"
source = "experiments/H17_generator_scorer_memory/08_does_the_past_view_help_at_all/REPORT.md"

[[checks]]
name = "12 scenes in closed loop, memory carried against memory reset"
result = "Not finished when this was recorded: the rule was written down and the adapter proofs had started, but no scene had been driven."
date = 2026-11-12
source = "experiments/H17_generator_scorer_memory/09_closed_loop_12_scenes/PREDICTIONS.md"

[[runs]]
id = "H17.r1"
label = "token cache: the frozen encoder's output at every moment of four slices"
started = 2026-11-08
ended = 2026-11-08
start_from = "3d566eb211b5"
frozen = ["all of Drive-JEPA 0.1.8b: encoder, generator and scorer"]
gpu_hours = 1.15
notes = """88.6 GB, fp32, one file per clip, under {runs}/generator_scorer_memory/cache; exact against a full \
forward pass at encoder batch 1 on 200 moments per slice. The starting model is identified by its sha256 \
only (3d566eb2...8b8e66, POINTERS.md): its own training record is not in this repository. The code was in a \
folder outside git when it ran, so there is no train_git_sha; AS_RUN.sha256 holds each file's hash as it ran."""

  [runs.code]
  as_run = ["experiments/H17_generator_scorer_memory/02_data_slices_and_token_cache/"]

  [[runs.data]]
  dataset = "physicalai_av"
  split = "training slice of the earlier retrain"
  role = "train"
  n = 126981
  unit = "moments"
  note = "4,015 clips"

  [[runs.data]]
  dataset = "physicalai_av"
  split = "picking set"
  role = "selection"
  n = 2591
  unit = "moments"
  note = "84 clips; 1,131 of the moments are graded"

  [[runs.data]]
  dataset = "physicalai_av"
  split = "graded held-out"
  role = "held-out"
  n = 10516
  unit = "moments"
  note = "355 clips; cached and never opened"

  [[runs.data]]
  dataset = "physicalai_av"
  split = "fresh raw held-out"
  role = "held-out"
  n = 9566
  unit = "moments"
