# H11 -- a HUGSIM trial beside neuroNCAP, checked by reproducing WA-JEPA's published 0.4462.
# Unassigned on the page; owner Navvrat because he has since done the work (paddock PR #118). Sources:
# "Renesas Progress and Plan", 22 Oct 2026 (Next steps item 11; "HUGSIM" section), paddock PR #118,
# docs/benchmarks/hugsim.md, docs/ROADMAP.md and results/hugsim/ on main.

schema = 1
id = "H11"
title = "HUGSIM trial beside neuroNCAP, checked by reproducing WA-JEPA's published 0.4462"
short = "HUGSIM trial"
track = "enabler"
owner = "Navvrat"
benchmarks = ["hugsim"]
started = 2026-10-21
status = "running"
verdict = "none"
priority = 11
question = """Should HUGSIM be adopted beside neuroNCAP? It has 436 scenarios from 4 datasets, with \
attacking cars, and its score is already PDM-style. Against it: no scene data on the machine, a CUDA \
rebuild for the Blackwell GPU, runs that do not repeat (its controller is timed by the wall clock), \
about 19 min a scenario. Decided after a trial on a nuScenes + PandaSet slice, checked by reproducing \
WA-JEPA's published 0.4462."""
learned = """So far: HUGSIM is a paddock benchmark (#118, merged 27 Oct PDT, 28 Oct IST) on 420 of the release's 436 \
scenarios (16 fail for every model), with upstream PR #57's controller fix. A 22 Oct campaign scored \
the released Drive-JEPA at HD-Score 0.338 on 419 of 420 (stored partial: HUGSIM crashed on one scenario) \
and AutoE2E at 0.057 on 420, one run per scenario, on adapters older than main's. WA-JEPA's 0.4462 has \
not been reproduced and no re-run noise is measured; no episode has yet been driven through the merged \
harness."""
narrative = "experiments/H11_hugsim/README.md"
external = [
  "paddock PR #118 (9c4e293); results/hugsim/drivejepa/campaign-87d4f5097a85db3c-ce3603/ and results/hugsim/autoe2e/campaign-f7d8f9d4b9736ddd-d03155/ (metrics.json, run.json); docs/benchmarks/hugsim.md.",
]

