ended = 2026-10-22
notes = "Served by paddock's drivejepa adapter as of ac7788f plus a per-call record of the 32 candidates: cameras uncropped, plain-score pick (main now crops, #106, and selects with momentum, #95). Front camera rendered only. Two lanes sharing one scenario queue. The weights are named in run.json's notes, not hashed there."

