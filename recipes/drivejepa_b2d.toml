# Drive-JEPA retrained on Bench2Drive: the stages behind Split-v4 (Bench2Drive 50 routes, mean DS 68.1) and
# the Final (73.6).
#
#   gallops recipe drivejepa_b2d                       print every command for this machine
#   gallops recipe drivejepa_b2d split-full --run      run one stage
#
# Lineage, data, and what was verified: docs/drivejepa_b2d.md. Every stage refuses to write into an
# output directory that already exists, so a rerun goes to a fresh {runs} or a fresh weights root.
#
# Site config this needs (gallops.toml):
#   [python] train              Python >= 3.11 with torch (the head stages and the checkpoint writer)
#   [python] drivejepa          Drive-JEPA's own interpreter (Python 3.9, navsim installed) for the generator
#   [code]   drivejepa          the Drive-JEPA checkout (its navsim_v2/ is the generator stage's cwd)
#   [datasets.navsim]           path + exp, as in paddock.toml: the generator stage's environment
#   [datasets.drivejepa_b2d]    path = the frozen data dump: rerank/ (rows, head inputs, labels, the feature
#                               cache, the new generator's candidates), release/ (the released checkpoint),
#                               teachers/ (MTD-H). Its file list and sha256 are recipes/drivejepa_b2d/data_*.json;
#                               the check-data stages compare a site's copy against them.

description = "Drive-JEPA retrained on Bench2Drive base: Split-v4 and the Final"

[vars]
rerank = "{data.drivejepa_b2d}/rerank"
release = "{data.drivejepa_b2d}/release/drive_jepa_perception_based_agent_vitl_v2.ckpt"
heldout = "{repo}/recipes/drivejepa_b2d/heldout_150.json"
out = "{runs}/drivejepa_b2d"

# ---------------------------------------------------------------------------------------------
# Split-v4: only the scorer head changes. Three head stages, each initialised from the one before.
# ---------------------------------------------------------------------------------------------

[[stage]]
name = "check-data"
python = "train"
module = "drivejepa_b2d.check_data"
# Sizes only, in seconds; add "--hash" to compare contents.
args = ["--root", "{data.drivejepa_b2d}", "--manifest", "{repo}/recipes/drivejepa_b2d/data_split_v4.json"]

[[stage]]
name = "ipad-base-start"
python = "train"
module = "drivejepa_b2d.train_ipad_head"
args = [
  "--feats", "{rerank}/_feats/pass*/feats_*.npz",
  "--dataset", "{rerank}/_dataset/b2d_base_v2.npz",
  "--labels", "{rerank}/_labels/b2d_base_v2_labels.npz",
  "--extra-dataset", "{rerank}/_dataset/b2d_start.npz",
  "--extra-feats", "{rerank}/_feats/start/feats_*.npz",
  "--extra-labels", "{rerank}/_labels/b2d_start_labels.npz",
  "--holdout-list", "{heldout}",
  "--init-ckpt", "{release}",
  "--out", "{out}/ipad-base-start",
]

[[stage]]
name = "split-full"
python = "train"
module = "drivejepa_b2d.train_split_head"
after = ["ipad-base-start"]
args = [
  "--dataset-base", "{rerank}/_dataset/b2d_base_v2.npz",
  "--dataset-start", "{rerank}/_dataset/b2d_start.npz",
  "--feats-base", "{rerank}/_feats/pass*/feats_*.npz",
  "--feats-start", "{rerank}/_feats/start/feats_*.npz",
  "--labels-base", "{rerank}/_labels/b2d_base_v3_labels.npz",
  "--labels-start", "{rerank}/_labels/b2d_start_v3_labels.npz",
  "--holdout-list", "{heldout}",
  "--init", "{out}/ipad-base-start/head_best.pt",
  "--labels-name", "v3",
  "--out", "{out}/split-full",
]

[[stage]]
name = "split-v4aug"
python = "train"
module = "drivejepa_b2d.train_split_head"
after = ["split-full"]
args = [
  "--dataset-base", "{rerank}/_dataset/b2d_base_v2.npz",
  "--dataset-start", "{rerank}/_dataset/b2d_start.npz",
  "--feats-base", "{rerank}/_feats/pass*/feats_*.npz",
  "--feats-start", "{rerank}/_feats/start/feats_*.npz",
  "--feats-aug", "{rerank}/_feats/aug/feats_*.npz",
  "--labels-base", "{rerank}/_labels/b2d_base_v4_labels.npz",
  "--labels-start", "{rerank}/_labels/b2d_start_v4_labels.npz",
  "--labels-aug", "{rerank}/_labels/b2d_aug_v4_labels.npz",
  "--holdout-list", "{heldout}",
  "--init", "{out}/split-full/head_best.pt",
  "--labels-name", "v4",
  "--out", "{out}/split-v4aug",
]

[[stage]]
name = "split-v4-checkpoint"
python = "train"
module = "drivejepa_b2d.write_checkpoint"
after = ["split-v4aug"]
args = [
  "--src", "{release}",
  "--head", "{out}/split-v4aug",
  "--model", "drivejepa_scorer_b2d",
  "--train-run", "split-v4",
  "--note", "Split-v4: split head (col / lane / ttc / red) on v4 labels + augmented light frames",
]

# ---------------------------------------------------------------------------------------------
# The Final: a fine-tuned generator, a split head and an area head on the new generator's candidates.
# ---------------------------------------------------------------------------------------------

[[stage]]
name = "check-data-final"
python = "train"
module = "drivejepa_b2d.check_data"
args = ["--root", "{data.drivejepa_b2d}", "--manifest", "{repo}/recipes/drivejepa_b2d/data_final.json"]

[[stage]]
name = "final-generator"
python = "drivejepa"
module = "drivejepa_b2d.train_generator"
# Load-bearing: the agent loads ./data/8192.npy relative to the cwd. Same cwd and env as paddock's
# drivejepa model.yaml gives its node.
cwd = "{code.drivejepa}/navsim_v2"
env = { NAVSIM_DEVKIT_ROOT = "{code.drivejepa}/navsim_v2", NAVSIM_EXP_ROOT = "{data.navsim.exp}", OPENSCENE_DATA_ROOT = "{data.navsim}", NUPLAN_MAPS_ROOT = "{data.navsim}/maps", NUPLAN_MAP_VERSION = "nuplan-maps-v1.0", DRIVE_JEPA_MSDA = "auto" }
args = [
  "--cache", "{rerank}/_genft_cache",
  "--teachers", "{data.drivejepa_b2d}/teachers",
  "--checkpoint", "{release}",
  "--out", "{out}/final-generator",
]

# Between final-generator and the two heads below, the candidates are re-dumped with the new generator
# ({rerank}/_mtdh/head_<set>_*.npz) and relabelled ({rerank}/_mtdh/labels, labels_m05b). Those data-preparation
# steps are not in this repo yet; the heads read their recorded output. See docs/drivejepa_b2d.md.

[[stage]]
name = "final-split-head"
python = "train"
module = "drivejepa_b2d.train_split_head"
after = ["split-v4aug", "final-generator"]
args = [
  "--dataset-base", "{rerank}/_dataset/b2d_base_v2.npz",
  "--dataset-start", "{rerank}/_dataset/b2d_start.npz",
  "--feats-base", "{rerank}/_mtdh/head_base_*.npz",
  "--feats-start", "{rerank}/_mtdh/head_start_*.npz",
  "--feats-aug", "{rerank}/_mtdh/head_aug_*.npz",
  "--labels-base", "{rerank}/_mtdh/labels_m05b/b2d_base_v4_labels.npz",
  "--labels-start", "{rerank}/_mtdh/labels_m05b/b2d_start_v4_labels.npz",
  "--labels-aug", "{rerank}/_mtdh/labels_m05b/b2d_aug_v4_labels.npz",
  "--holdout-list", "{heldout}",
  "--init", "{out}/split-v4aug/head_best.pt",
  "--labels-name", "v4-m05b",
  "--out", "{out}/final-split-head",
]

[[stage]]
name = "final-area-head"
python = "train"
module = "drivejepa_b2d.train_area_head"
after = ["final-generator"]
args = [
  "--rows-base", "{rerank}/_dataset/b2d_base_v2.npz",
  "--rows-start", "{rerank}/_dataset/b2d_start.npz",
  "--dump", "{rerank}/_mtdh",
  "--labels", "{rerank}/_mtdh/labels",
  "--holdout-list", "{heldout}",
  "--init-ckpt", "{release}",
  "--out", "{out}/final-area-head",
]

[[stage]]
name = "final-checkpoint"
python = "train"
module = "drivejepa_b2d.write_checkpoint"
after = ["final-generator", "final-split-head"]
# The Final was written over Split-v4's checkpoint; its split head replaces the same 10 tensors, so writing over
# the release gives the same tensors (checked against the deployed file, docs/drivejepa_b2d.md).
args = [
  "--src", "{release}",
  "--head", "{out}/final-split-head",
  "--gen", "{out}/final-generator/gen_best.pt",
  "--model", "drivejepa_scorer_b2d",
  "--train-run", "final",
  "--note", "The Final: MTD-H generator (batch-fixed) + split head on m05b labels; area head loaded separately",
]
