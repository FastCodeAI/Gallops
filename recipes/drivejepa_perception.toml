[[stage]]
name = "b2-lora-S"
python = "drivejepa"
module = "drivejepa_perception.train_refiner"
args = ["--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--pdm", "{out}/pdm-v1", "--anchors", "{out}/anchors-v1", "--mode", "lora",
        "--arm", "S", "--seeds", "0,1,2", "--out", "{out}/b2/lora-S", "--agents", "{out}/agents-a1-s0"]

[[stage]]
name = "b2-full-C"
python = "drivejepa"
module = "drivejepa_perception.train_refiner"
args = ["--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--pdm", "{out}/pdm-v1", "--anchors", "{out}/anchors-v1", "--mode", "full",
        "--arm", "C", "--seeds", "0,1,2", "--out", "{out}/b2/full-C"]

[[stage]]
name = "b2-full-F"
python = "drivejepa"
module = "drivejepa_perception.train_refiner"
args = ["--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--pdm", "{out}/pdm-v1", "--anchors", "{out}/anchors-v1", "--mode", "full",
        "--arm", "F", "--seeds", "0,1,2", "--out", "{out}/b2/full-F", "--agents", "{out}/agents-a1-s0"]

[[stage]]
name = "b2-full-O"
python = "drivejepa"
module = "drivejepa_perception.train_refiner"
args = ["--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--pdm", "{out}/pdm-v1", "--anchors", "{out}/anchors-v1", "--mode", "full",
        "--arm", "O", "--seeds", "0,1,2", "--out", "{out}/b2/full-O"]

[[stage]]
name = "b2-full-S"
python = "drivejepa"
module = "drivejepa_perception.train_refiner"
args = ["--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--pdm", "{out}/pdm-v1", "--anchors", "{out}/anchors-v1", "--mode", "full",
        "--arm", "S", "--seeds", "0,1,2", "--out", "{out}/b2/full-S", "--agents", "{out}/agents-a1-s0"]

# ---------------------------------------------------------------------------------------------
# B3: LoRA on the ViT's last four blocks (vit_lora.py). Blocks 1-20 are frozen in every variant, so
# their output is cached once for B3's rows -- a seeded 20,000 train rows plus the select and report
# logs, 30 GB -- and neither images nor the first 20 blocks run while B3 trains. The pass is held to
# the ViT-out cache through the frozen tail before it writes a row.
#
# B3.1: both arms start from A1 seed 0's kept epoch and train the same steps on the same rows; they
# differ only in LoRA. B3.2 (reduced; README): B3.1 seed 0's LoRA in the trunk, the planner unchanged.
# ---------------------------------------------------------------------------------------------

[[stage]]
name = "block20"
python = "drivejepa"
module = "drivejepa_perception.tokens"
args = ["--block20", "--labels", "{out}/labels-v1", "--vit-dir", "{out}/tokens-vit-v1", "--out", "{out}/block20-v1",
        "--workers", "24", "--batch", "16"]

[[stage]]
name = "b3-lora"
python = "drivejepa"
module = "drivejepa_perception.train_vit_lora"
args = ["train", "--block20", "{out}/block20-v1", "--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1",
        "--run", "{out}/runs/a1-s0", "--arm", "lora", "--seeds", "0,1,2", "--out", "{out}/b3/lora"]

[[stage]]
name = "b3-control"
python = "drivejepa"
module = "drivejepa_perception.train_vit_lora"
args = ["train", "--block20", "{out}/block20-v1", "--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1",
        "--run", "{out}/runs/a1-s0", "--arm", "control", "--seeds", "0,1,2", "--out", "{out}/b3/control"]

[[stage]]
name = "b3-shared"
python = "drivejepa"
module = "drivejepa_perception.train_vit_lora"
args = ["shared", "--block20", "{out}/block20-v1", "--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1",
        "--pdm", "{out}/pdm-v1", "--from-run", "{out}/b3/lora", "--seed", "0", "--out", "{out}/b3/shared-s0"]

# ---------------------------------------------------------------------------------------------
# OOD (P15): nuScenes, which nothing in H15 or the release saw. H14's 102 held-out train scenes
# (recipes/drivejepa_aux/heldout_scenes.json), inputs through H14's TablesTickDataset, the release at
# batch 1; the side-car zero-shot and every B1 run against the release's pick (ood.py).
# Site config: [datasets.nuscenes] (v1.0-trainval tables, samples/, can_bus/), and [code] paddock: H14's
# nuScenes code imports paddock's command rule and neuroNCAP scene list (gallops.data.nuscenes_real).
# ---------------------------------------------------------------------------------------------

[[stage]]
name = "ood-extract"
python = "drivejepa"
module = "drivejepa_perception.ood"
env = { PYTHONPATH = "{code.paddock}/src" }
args = ["extract", "--out", "{out}/nusc-extract"]

[[stage]]
name = "ood-pass"
python = "drivejepa"
module = "drivejepa_perception.ood"
env = { PYTHONPATH = "{code.paddock}/src" }
args = ["pass", "--extract", "{out}/nusc-extract", "--out", "{out}/nusc-v1", "--workers", "16"]

[[stage]]
name = "ood-read"
python = "drivejepa"
module = "drivejepa_perception.ood"
env = { PYTHONPATH = "{code.paddock}/src" }
args = ["read", "--nusc", "{out}/nusc-v1", "--sidecar", "{out}/runs/a1-s0", "--b1", "{out}/b1",
        "--out", "{out}/ood/ood.json"]
