# ---------------------------------------------------------------------------------------------
# Part B · B-0-2, the official scorer and the anchor (D24). R's plan store is the release's pick of its
# own 32 proposals from the token pass; `score` replays a store through navsim's run_pdm_score.py on all
# 12,146 navtest tokens (CPU, no momentum) and refuses unless the cache is still the verified one, the
# store covers navtest, and every plan the agent handed over equals the store's. `live` runs the release
# itself through the same scorer (one GPU). `anchor` holds the replay to H04's 87.78 / 84.49 (B0-G8) and to
# the live release (B0-G9): if it fails, nothing on navtest is compared.
# ---------------------------------------------------------------------------------------------

[[stage]]
name = "part-b-0-plans-R"
