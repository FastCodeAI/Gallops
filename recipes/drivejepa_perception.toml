module = "drivejepa_perception.navsim_data"
args = ["check", "--labels", "{out}/labels-fresh-v1"]
after = ["part-b-0-labels-fresh"]

# The token and ViT-out passes for navtest and R-clean (one GPU; launched with CUDA_VISIBLE_DEVICES
# set by whoever runs them). Each reads its data split from the labels pass's manifest, saves the
# release's own scores, and refuses to finish unless its pick is their argmax on every row (B0-G5).
# The ViT-out pass is held to the token pass's evenly spread tap rows before it writes a row.

[[stage]]
