module = "drivejepa_perception.navtest"
args = ["anchor", "--replay", "{out}/part-b/b0/navtest-R", "--live", "{out}/part-b/b0/navtest-R-live",
        "--tokens", "{out}/tokens-navtest-v1", "--labels", "{out}/labels-navtest-v1", "--out", "{out}/part-b/b0/anchor"]
after = ["part-b-0-score-R", "part-b-0-live-R"]

