# H15: a perception side-car on frozen Drive-JEPA (3D boxes + each agent's 1 s path), tested as an input to
# the scorer, to the refiner, and against LoRA on the ViT.
#
#   gallops recipe drivejepa_perception                    print every command for this machine
#   gallops recipe drivejepa_perception labels --run       run one stage
#
# The plan, its rules and the reasons for them: docs/drivejepa-perception-sidecar.md. The record:
# experiments/H15_perception_sidecar/. Every pass refuses to write into an output that already exists.
#
# Site config this needs (gallops.toml):
#   [python] drivejepa               Drive-JEPA's interpreter (Python 3.9, torch 2.1, mmcv-full 1.7.2)
#   [code]   drivejepa               upstream Drive-JEPA e21f474 with the three patches in
#                                    recipes/drivejepa_perception/patches/ applied as commits (paddock's,
#                                    copied at paddock c6597a9). 0001 is required on GPUs above sm_86.
#   [datasets.navsim]                NAVSIM's root (navsim_logs/, sensor_blobs/, maps/), with exp = where
#                                    Drive-JEPA-cache/ holds the released checkpoint
#   [datasets.navsim_metric_cache]   Drive-JEPA's train_metric_cache_v2_pruned (phase B's PDM labels)
#
# The splits are committed in recipes/drivejepa_perception/splits.json: select = H04's 51 held-out navtrain
# logs (branch drivejepa-wajepa/run3a, e5ca907, recipes/drivejepa_wajepa/heldout_logs.txt), report = the
# seeded draw `navsim_data.draw_splits` makes, train = the rest. Every pass re-draws them and refuses an edit.

description = "H15: perception side-car on frozen Drive-JEPA"

[vars]
out = "{runs}/drivejepa_perception"

# ---------------------------------------------------------------------------------------------
# S0: the data passes. CPU for the labels; the token pass needs one GPU at batch 1.
# ---------------------------------------------------------------------------------------------

[[stage]]
name = "labels"
python = "drivejepa"
module = "drivejepa_perception.navsim_data"
args = ["labels", "--out", "{out}/labels-v1", "--workers", "24"]

[[stage]]
name = "check-labels"
python = "drivejepa"
module = "drivejepa_perception.navsim_data"
# Held to NAVSIM's and nuPlan's own code on 60 windows; exits 1 on any problem.
args = ["check", "--labels", "{out}/labels-v1", "--windows", "60"]

[[stage]]
name = "tokens"
python = "drivejepa"
module = "drivejepa_perception.tokens"
# One GPU (set CUDA_VISIBLE_DEVICES); eval mode; batch 16 with batch_fix, held to batch 1 on 32 rows before
# it starts. ~27 GB of fp16 tokens plus ~29 GB of A0 taps. Resumes from its staging directory if interrupted.
args = ["--labels", "{out}/labels-v1", "--out", "{out}/tokens-v1", "--workers", "24", "--batch", "16"]

# ---------------------------------------------------------------------------------------------
# Phase A: the side-car alone. One GPU; ~4 M parameters on cached tokens. Every stage runs the
# preflight (train_sidecar -> preflight.run) before its first step.
# ---------------------------------------------------------------------------------------------

[[stage]]
name = "overfit"
python = "drivejepa"
module = "drivejepa_perception.train_sidecar"
# H04's check 1: 64 train samples to centre error < 0.5 m and class accuracy > 95% within 4,000 steps.
args = ["overfit", "--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1"]

# A0: which frozen tap carries 3D? One-layer probes, 6 epochs on the 10,000 tap train rows, read on
# the select logs (the taps exist only there). PREDICTIONS.md P1.
[[stage]]
name = "a0-post"
python = "drivejepa"
module = "drivejepa_perception.train_sidecar"
args = ["train", "--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--out", "{out}/runs/a0-post",
        "--tap", "post", "--layers", "1", "--rows", "tap", "--epochs", "6"]

[[stage]]
name = "a0-vit-out"
python = "drivejepa"
module = "drivejepa_perception.train_sidecar"
args = ["train", "--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--out", "{out}/runs/a0-vit-out",
        "--tap", "vit_out", "--layers", "1", "--rows", "tap", "--epochs", "6"]

[[stage]]
name = "a0-block12"
python = "drivejepa"
module = "drivejepa_perception.train_sidecar"
args = ["train", "--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--out", "{out}/runs/a0-block12",
        "--tap", "block12", "--layers", "1", "--rows", "tap", "--epochs", "6"]

# ---------------------------------------------------------------------------------------------
# S0.5: phase B's labels. CPU only: the vendored PDM scorer on every sample's 32 release candidates
# and on the human's plan, against Drive-JEPA's pruned v2 train metric cache.
# ---------------------------------------------------------------------------------------------

[[stage]]
name = "pdm"
python = "drivejepa"
module = "drivejepa_perception.pdm_labels"
args = ["build", "--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--out", "{out}/pdm-v1", "--workers", "48"]

[[stage]]
name = "check-pdm"
python = "drivejepa"
module = "drivejepa_perception.pdm_labels"
# Re-scores 50 random rows; exits 1 unless every one equals the stored labels exactly.
args = ["check", "--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--out", "{out}/pdm-v1", "--rows", "50"]

# A1's no-camera baseline: the same side-car, trained identically, on zeroed tokens (H-A's reference).
[[stage]]
name = "a1-blind"
python = "drivejepa"
module = "drivejepa_perception.train_sidecar"
args = ["train", "--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--out", "{out}/runs/a1-blind",
        "--blind", "--seed", "0"]

# A0's two 1024-d probes trained fully; their summaries are written from the saved epochs (select logs only:
# a 1024-d tap exists only for A0's rows).
[[stage]]
name = "a0-vit-out-finish"
python = "drivejepa"
module = "drivejepa_perception.train_sidecar"
args = ["finish", "--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--out", "{out}/runs/a0-vit-out"]

[[stage]]
name = "a0-block12-finish"
python = "drivejepa"
module = "drivejepa_perception.train_sidecar"
args = ["finish", "--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--out", "{out}/runs/a0-block12"]

# A0 chose the ViT's own output (before the projector): select F1 0.338 against 0.257 post-projector and 0.269
# at block 12 (PREDICTIONS.md P1). It is cached here for every row, held to the full forward's tap first.
# The readout's "within 30 m" ran to 35 m until ad778cf (README). These read A0's probes and the blind
# arm again at the epochs they kept, with the fixed readout, beside their as-run files.

[[stage]]
name = "a0-post-reread"
python = "drivejepa"
module = "drivejepa_perception.train_sidecar"
args = ["reread", "--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--run", "{out}/runs/a0-post"]

[[stage]]
name = "a0-vit-out-reread"
python = "drivejepa"
module = "drivejepa_perception.train_sidecar"
args = ["reread", "--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--run", "{out}/runs/a0-vit-out"]

[[stage]]
name = "a0-block12-reread"
python = "drivejepa"
module = "drivejepa_perception.train_sidecar"
args = ["reread", "--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--run", "{out}/runs/a0-block12"]

[[stage]]
name = "a1-blind-reread"
python = "drivejepa"
module = "drivejepa_perception.train_sidecar"
args = ["reread", "--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--run", "{out}/runs/a1-blind"]

[[stage]]
name = "tokens-vit"
python = "drivejepa"
module = "drivejepa_perception.tokens"
args = ["--vit-out-all", "--labels", "{out}/labels-v1", "--tokens", "{out}/tokens-v1", "--out", "{out}/tokens-vit-v1",
        "--workers", "24", "--batch", "16"]

# A1: the side-car on A0's tap, 3 seeds, and 128 queries on seed 0. PREDICTIONS.md P2-P5.
[[stage]]
name = "a1-s0"
python = "drivejepa"
module = "drivejepa_perception.train_sidecar"
args = ["train", "--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--vit-tokens", "{out}/tokens-vit-v1",
        "--tap", "vit_out", "--out", "{out}/runs/a1-s0", "--seed", "0"]

[[stage]]
name = "a1-s1"
python = "drivejepa"
module = "drivejepa_perception.train_sidecar"
args = ["train", "--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--vit-tokens", "{out}/tokens-vit-v1",
        "--tap", "vit_out", "--out", "{out}/runs/a1-s1", "--seed", "1"]

[[stage]]
name = "a1-s2"
python = "drivejepa"
module = "drivejepa_perception.train_sidecar"
args = ["train", "--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--vit-tokens", "{out}/tokens-vit-v1",
        "--tap", "vit_out", "--out", "{out}/runs/a1-s2", "--seed", "2"]

[[stage]]
name = "a1-q128"
python = "drivejepa"
module = "drivejepa_perception.train_sidecar"
args = ["train", "--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--vit-tokens", "{out}/tokens-vit-v1",
        "--tap", "vit_out", "--out", "{out}/runs/a1-q128", "--seed", "0", "--queries", "128"]

# ---------------------------------------------------------------------------------------------
# S0.8: the release's own picks on the select and report logs (in-sample for it).
# ---------------------------------------------------------------------------------------------

[[stage]]
name = "release"
python = "drivejepa"
module = "drivejepa_perception.train_scorer"
args = ["--release-only", "--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--pdm", "{out}/pdm-v1",
        "--out", "{out}/release"]

# ---------------------------------------------------------------------------------------------
# The agents phase B reads: A1 seed 0's kept epoch (fixed before any A1 result) on every row.
# ---------------------------------------------------------------------------------------------

[[stage]]
name = "agents"
python = "drivejepa"
module = "drivejepa_perception.train_sidecar"
args = ["agents", "--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--run", "{out}/runs/a1-s0",
        "--out", "{out}/agents-a1-s0"]

# ---------------------------------------------------------------------------------------------
# B1: four scorer modes x arms. C needs no agents; F reads the side-car's, S another log's, O the labels'.
#
# The loss is chosen first, on the select logs and the C arm only, before any arm reads an agent: the
# first C runs (84fd73e, loss `imitation`, kept as {out}/b1-imitation) picked the candidate nearest the
# human and lost 2.5-2.7 points of select pick EPDMS to the release. b1-choose-loss (977bb56) chose
# `bce` by its fixed rule: mean over modes 0.9199, against imitation 0.8948 and best 0.8644.
# ---------------------------------------------------------------------------------------------

[[stage]]
name = "b1-choose-loss"
python = "drivejepa"
module = "drivejepa_perception.train_scorer"
args = ["--choose-loss", "--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--pdm", "{out}/pdm-v1",
        "--out", "{out}/b1-choose-loss"]

[[stage]]
name = "b1-frozen-C"
python = "drivejepa"
module = "drivejepa_perception.train_scorer"
args = ["--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--pdm", "{out}/pdm-v1", "--mode", "frozen",
        "--arm", "C", "--loss", "bce", "--seeds", "0,1,2", "--out", "{out}/b1/frozen-C"]

[[stage]]
name = "b1-frozen-F"
python = "drivejepa"
module = "drivejepa_perception.train_scorer"
args = ["--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--pdm", "{out}/pdm-v1", "--mode", "frozen",
        "--arm", "F", "--loss", "bce", "--seeds", "0,1,2", "--out", "{out}/b1/frozen-F", "--agents", "{out}/agents-a1-s0"]

[[stage]]
name = "b1-frozen-O"
python = "drivejepa"
module = "drivejepa_perception.train_scorer"
args = ["--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--pdm", "{out}/pdm-v1", "--mode", "frozen",
        "--arm", "O", "--loss", "bce", "--seeds", "0,1,2", "--out", "{out}/b1/frozen-O"]

[[stage]]
name = "b1-frozen-S"
python = "drivejepa"
module = "drivejepa_perception.train_scorer"
args = ["--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--pdm", "{out}/pdm-v1", "--mode", "frozen",
        "--arm", "S", "--loss", "bce", "--seeds", "0,1,2", "--out", "{out}/b1/frozen-S", "--agents", "{out}/agents-a1-s0"]

[[stage]]
name = "b1-lora-C"
python = "drivejepa"
module = "drivejepa_perception.train_scorer"
args = ["--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--pdm", "{out}/pdm-v1", "--mode", "lora",
        "--arm", "C", "--loss", "bce", "--seeds", "0,1,2", "--out", "{out}/b1/lora-C"]

[[stage]]
name = "b1-lora-F"
python = "drivejepa"
module = "drivejepa_perception.train_scorer"
args = ["--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--pdm", "{out}/pdm-v1", "--mode", "lora",
        "--arm", "F", "--loss", "bce", "--seeds", "0,1,2", "--out", "{out}/b1/lora-F", "--agents", "{out}/agents-a1-s0"]

[[stage]]
name = "b1-lora-O"
python = "drivejepa"
module = "drivejepa_perception.train_scorer"
args = ["--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--pdm", "{out}/pdm-v1", "--mode", "lora",
        "--arm", "O", "--loss", "bce", "--seeds", "0,1,2", "--out", "{out}/b1/lora-O"]

[[stage]]
name = "b1-lora-S"
python = "drivejepa"
module = "drivejepa_perception.train_scorer"
args = ["--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--pdm", "{out}/pdm-v1", "--mode", "lora",
        "--arm", "S", "--loss", "bce", "--seeds", "0,1,2", "--out", "{out}/b1/lora-S", "--agents", "{out}/agents-a1-s0"]

[[stage]]
name = "b1-full-C"
python = "drivejepa"
module = "drivejepa_perception.train_scorer"
args = ["--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--pdm", "{out}/pdm-v1", "--mode", "full",
        "--arm", "C", "--loss", "bce", "--seeds", "0,1,2", "--out", "{out}/b1/full-C"]

[[stage]]
name = "b1-full-F"
python = "drivejepa"
module = "drivejepa_perception.train_scorer"
args = ["--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--pdm", "{out}/pdm-v1", "--mode", "full",
        "--arm", "F", "--loss", "bce", "--seeds", "0,1,2", "--out", "{out}/b1/full-F", "--agents", "{out}/agents-a1-s0"]

[[stage]]
name = "b1-full-O"
python = "drivejepa"
module = "drivejepa_perception.train_scorer"
args = ["--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--pdm", "{out}/pdm-v1", "--mode", "full",
        "--arm", "O", "--loss", "bce", "--seeds", "0,1,2", "--out", "{out}/b1/full-O"]

[[stage]]
name = "b1-full-S"
python = "drivejepa"
module = "drivejepa_perception.train_scorer"
args = ["--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--pdm", "{out}/pdm-v1", "--mode", "full",
        "--arm", "S", "--loss", "bce", "--seeds", "0,1,2", "--out", "{out}/b1/full-S", "--agents", "{out}/agents-a1-s0"]

[[stage]]
name = "b1-replace-C"
python = "drivejepa"
module = "drivejepa_perception.train_scorer"
args = ["--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--pdm", "{out}/pdm-v1", "--mode", "replace",
        "--arm", "C", "--loss", "bce", "--seeds", "0,1,2", "--out", "{out}/b1/replace-C"]

[[stage]]
name = "b1-replace-F"
python = "drivejepa"
module = "drivejepa_perception.train_scorer"
args = ["--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--pdm", "{out}/pdm-v1", "--mode", "replace",
        "--arm", "F", "--loss", "bce", "--seeds", "0,1,2", "--out", "{out}/b1/replace-F", "--agents", "{out}/agents-a1-s0"]

[[stage]]
name = "b1-replace-O"
python = "drivejepa"
module = "drivejepa_perception.train_scorer"
args = ["--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--pdm", "{out}/pdm-v1", "--mode", "replace",
        "--arm", "O", "--loss", "bce", "--seeds", "0,1,2", "--out", "{out}/b1/replace-O"]

[[stage]]
name = "b1-replace-S"
python = "drivejepa"
module = "drivejepa_perception.train_scorer"
args = ["--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--pdm", "{out}/pdm-v1", "--mode", "replace",
        "--arm", "S", "--loss", "bce", "--seeds", "0,1,2", "--out", "{out}/b1/replace-S", "--agents", "{out}/agents-a1-s0"]

# B1's verdicts by the pre-registered rule, from every <mode>-<arm> run under {out}/b1; then B1.6's
# explanation test on every F mode at seed 0 (decided before any F result: no mode is chosen).

[[stage]]
name = "b1-report"
python = "drivejepa"
module = "drivejepa_perception.b_report"
args = ["--labels", "{out}/labels-v1", "--pdm", "{out}/pdm-v1", "--runs", "{out}/b1", "--out", "{out}/b1/report.json"]

[[stage]]
name = "b1-explain-frozen"
python = "drivejepa"
module = "drivejepa_perception.explain"
args = ["--run", "{out}/b1/frozen-F", "--seed", "0", "--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1",
        "--pdm", "{out}/pdm-v1", "--agents", "{out}/agents-a1-s0", "--out", "{out}/b1/explain-frozen.json"]

[[stage]]
name = "b1-explain-lora"
python = "drivejepa"
module = "drivejepa_perception.explain"
args = ["--run", "{out}/b1/lora-F", "--seed", "0", "--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1",
        "--pdm", "{out}/pdm-v1", "--agents", "{out}/agents-a1-s0", "--out", "{out}/b1/explain-lora.json"]

[[stage]]
name = "b1-explain-full"
python = "drivejepa"
module = "drivejepa_perception.explain"
args = ["--run", "{out}/b1/full-F", "--seed", "0", "--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1",
        "--pdm", "{out}/pdm-v1", "--agents", "{out}/agents-a1-s0", "--out", "{out}/b1/explain-full.json"]

[[stage]]
name = "b1-explain-replace"
python = "drivejepa"
module = "drivejepa_perception.explain"
args = ["--run", "{out}/b1/replace-F", "--seed", "0", "--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1",
        "--pdm", "{out}/pdm-v1", "--agents", "{out}/agents-a1-s0", "--out", "{out}/b1/explain-replace.json"]

# ---------------------------------------------------------------------------------------------
# B2: three refiner modes x arms, the release's own planning loss. Read at the last epoch; the new
# candidates are PDM-scored offline. Same arms and agents as B1. The teachers are gathered into one
# array first: read per row from NFS they cost 2.1 s per batch of 64.
# ---------------------------------------------------------------------------------------------

[[stage]]
name = "anchors"
python = "drivejepa"
module = "drivejepa_perception.train_refiner"
args = ["--gather-anchors", "--labels", "{out}/labels-v1", "--out", "{out}/anchors-v1"]

[[stage]]
name = "b2-frozen-C"
python = "drivejepa"
module = "drivejepa_perception.train_refiner"
args = ["--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--pdm", "{out}/pdm-v1", "--anchors", "{out}/anchors-v1", "--mode", "frozen",
        "--arm", "C", "--seeds", "0,1,2", "--out", "{out}/b2/frozen-C"]

[[stage]]
