# pinned by its sha256) and fresh, the R-clean split (the trainval logs no NAVSIM scene filter names,
# every routed window). A list stage writes its file once; run again, it derives the list again and
# refuses any difference, so a rerun is a check. Labels on CPU; every pass refuses an existing output.
# ---------------------------------------------------------------------------------------------

[[stage]]
name = "part-b-0-navtest-list"
python = "drivejepa"
module = "drivejepa_perception.navsim_data"
args = ["navtest-list", "--write", "{repo}/recipes/drivejepa_perception/navtest.json"]

