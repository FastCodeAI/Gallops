args = ["--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--pdm", "{out}/pdm-v1", "--anchors", "{out}/anchors-v1", "--mode", "frozen",
        "--arm", "S", "--seeds", "0,1,2", "--out", "{out}/b2/frozen-S", "--agents", "{out}/agents-a1-s0"]

[[stage]]
