[[stage]]
name = "b1-explain-replace"
python = "drivejepa"
module = "drivejepa_perception.explain"
args = ["--run", "{out}/b1/replace-F", "--seed", "0", "--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1",
        "--pdm", "{out}/pdm-v1", "--agents", "{out}/agents-a1-s0", "--out", "{out}/b1/explain-replace.json"]

# B1.6's AUC for the controls too, every seed: whether the agents improve the sub-scores' calibration.

[[stage]]
name = "b1-calibration-frozen-C"
python = "drivejepa"
module = "drivejepa_perception.explain"
args = ["--calibration-only", "--run", "{out}/b1/frozen-C", "--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1",
