python = "drivejepa"
module = "drivejepa_perception.train_refiner"
args = ["--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1", "--pdm", "{out}/pdm-v1", "--anchors", "{out}/anchors-v1", "--mode", "lora",
        "--arm", "C", "--seeds", "0,1,2", "--out", "{out}/b2/lora-C"]

[[stage]]
