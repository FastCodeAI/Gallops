after = ["part-b-1-navtest"]

# The train rows' agents from the cross-fit side-cars (one GPU, minutes): each train row decoded by the
# side-car that did not see its log. Each fold must pass B0-G11 (select F1 within 0.02 of seed 0's) and
# reproduce its recorded select F1 when decoded here. For B-2 onward; B-1 reads no train row.

[[stage]]
name = "part-b-0-crossfit-agents"
python = "drivejepa"
module = "drivejepa_perception.train_sidecar"
args = ["crossfit-agents",
        "--runs", "{out}/part-b/b0/crossfit-v3-f0,{out}/part-b/b0/crossfit-v3-f1,{out}/part-b/b0/crossfit-v3-f2,{out}/part-b/b0/crossfit-v3-f3,{out}/part-b/b0/crossfit-v3-f4",
        "--reference", "{out}/part-a/5b-v3-e24-s0", "--tokens", "{out}/tokens-v1", "--labels", "{out}/labels-v1",
        "--vit-tokens", "{out}/tokens-vit-v1", "--out", "{out}/agents-train-crossfit-v3"]
after = ["part-b-0-crossfit-f0", "part-b-0-crossfit-f1", "part-b-0-crossfit-f2", "part-b-0-crossfit-f3", "part-b-0-crossfit-f4"]

# B-0-4's proposal analysis, first on R against R-tilde (CPU, minutes).

[[stage]]
name = "part-b-0-analysis-R-Rtilde"
python = "drivejepa"
module = "drivejepa_perception.b_analysis"
args = ["compare", "--root", "{out}", "--split", "navtest", "--a", "R=tokens-navtest-v1", "--b", "R-tilde=rtilde-navtest-v1",
        "--pdm-a", "pdm-navtest-v1", "--out", "{out}/part-b/b0/analysis-R-Rtilde.json"]
after = ["part-b-0-rtilde-navtest", "part-b-0-pdm-navtest"]

# B-1-4, the soft veto (D27; PREDICTIONS.md, Part B · B-1-4): its grid on R-clean's known-command windows,
# frozen once, then navtest read once for it alone. The grid refuses until its PREDICTIONS.md section is committed.

[[stage]]
name = "part-b-1-4-grid"
python = "drivejepa"
module = "drivejepa_perception.veto"
args = ["soft-grid", "--root", "{out}", "--out", "{out}/part-b/b1/grid-b14-fresh"]
after = ["part-b-1-navtest"]

[[stage]]
name = "part-b-1-4-freeze"
python = "drivejepa"
module = "drivejepa_perception.veto"
args = ["soft-freeze", "--grid", "{out}/part-b/b1/grid-b14-fresh", "--write", "{repo}/recipes/drivejepa_perception/part_b14_frozen.json"]
after = ["part-b-1-4-grid"]

[[stage]]
name = "part-b-1-4-navtest"
python = "drivejepa"
module = "drivejepa_perception.veto"
args = ["soft-navtest", "--root", "{out}", "--grid", "{out}/part-b/b1/grid-b14-fresh", "--verified", "{out}/part-b/b0/navtest-cache-verify",
        "--anchor", "{out}/part-b/b0/anchor-d26", "--r", "{out}/part-b/b0/navtest-R", "--out", "{out}/part-b/b1/navtest-b14"]
after = ["part-b-1-4-freeze"]
