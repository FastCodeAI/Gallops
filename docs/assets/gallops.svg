    <g fill="#2E8B4E">
      <path d="M196 372 L196 336 Q196 316 216 312 L244 306 L274 262 Q282 250 296 250 L356 250 Q370 250 378 262 L404 306 L426 312 Q444 316 444 336 L444 372 Q444 388 428 388 L212 388 Q196 388 196 372 Z" transform="translate(-24 0)"/>
    </g>
    <g fill="#14482A">
