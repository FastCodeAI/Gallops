<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Gallops">
  <title>Gallops</title>
  <rect width="512" height="512" rx="112" fill="#E6F4EA"/>
  <g transform="translate(256 256) scale(1.12) translate(-256 -350)">
    <!-- the gallops: a training track, and the car made fast on it -->
