# The gate. Only `make setup` and `make check` run here: anything that can reject work belongs in the
# Makefile, so a green local run and a green PR are the same claim (tests/test_experiments.py holds this).
name: check

on:
  # No `branches` filter: gallops PRs stack, so a PR's base is often another PR's branch. GitHub reads
  # this file from the PR's merge, so a stacked PR gets it once its base has taken main.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: make setup
      - run: make check
