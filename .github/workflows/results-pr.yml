# Holds a results PR's title and description to the record (docs/experiments.md#results-pr). The one check
# outside `make check`: a PR's title and description exist only on GitHub. It is a workflow of its own
# because editing them must re-run this and not the test suite.
name: results-pr

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  results-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # HEAD is GitHub's merge of the PR into its base and HEAD^ is that base, so comparing the two gives
      # what this PR adds, even when the branch is behind its base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: make setup
      # Through the environment, never `${{ }}` inside `run`: a PR's text would become shell.
      - run: .venv/bin/gallops experiments pr-check --base HEAD^
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
